<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1130" width="600" height="1130" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Foam: one render texture fed back into itself</title><desc id="d">Each frame the previous foam texture is drawn through the FoamBlit shader into a second texture, which fades the old foam and adds new foam where the waves are compressed; the two textures are swapped, and the ocean shader reads the result.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="600" height="1130" rx="14" fill="#111"/><text x="30.0" y="48.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">Foam: one render texture</text><text x="30.0" y="82.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">fed back into itself</text><rect x="30.0" y="100.0" width="540.0" height="110.0" rx="8" fill="#141c19" stroke="#ff5c5c" stroke-width="2"/><text x="44.0" y="130.0" font-size="21" fill="#ff5c5c" text-anchor="start" font-weight="bold">foamRT (last frame)</text><text x="44.0" y="162.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">1024 × 1024, R16, covers world x,z 0 → 500</text><line x1="300.0" y1="210.0" x2="300.0" y2="252.0" stroke="#a8a8a8" stroke-width="2.4" marker-end="url(#ah)"/><text x="312.0" y="238.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">Graphics.Blit</text><rect x="30.0" y="256.0" width="540.0" height="290.0" rx="8" fill="#141c19" stroke="#38de2c" stroke-width="2"/><text x="44.0" y="286.0" font-size="21" fill="#38de2c" text-anchor="start" font-weight="bold">FoamBlit shader</text><text x="44.0" y="318.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">for every texel:</text><text x="44.0" y="344.6" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">  evaluate all waves at x,z</text><text x="44.0" y="371.2" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">  ridge = compression</text><text x="44.0" y="397.8" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">        × leading × noise</text><text x="44.0" y="424.4" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">  foam = saturate(prev × 0.985</text><text x="44.0" y="451.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">          + ridge × 1.5)</text><text x="44.0" y="477.6" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">  border 1 % → 0</text><line x1="300.0" y1="546.0" x2="300.0" y2="588.0" stroke="#a8a8a8" stroke-width="2.4" marker-end="url(#ah)"/><rect x="30.0" y="592.0" width="540.0" height="100.0" rx="8" fill="#141c19" stroke="#ff5c5c" stroke-width="2"/><text x="44.0" y="622.0" font-size="21" fill="#ff5c5c" text-anchor="start" font-weight="bold">foamRTTemp</text><text x="44.0" y="654.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">new foam values (red channel)</text><path d="M 570 642 L 588 642 L 588 155 L 572 155" fill="none" stroke="#ffd24a" stroke-width="2.4" marker-end="url(#ah)" stroke-dasharray="7 5"/><text x="30.0" y="730.0" font-size="18" fill="#ffd24a" text-anchor="start" font-weight="normal">Swap the two → the next frame starts</text><text x="30.0" y="756.0" font-size="18" fill="#ffd24a" text-anchor="start" font-weight="normal">from this result.</text><rect x="30.0" y="800.0" width="540.0" height="130.0" rx="8" fill="#141c19" stroke="#4ad8ff" stroke-width="2"/><text x="44.0" y="830.0" font-size="21" fill="#4ad8ff" text-anchor="start" font-weight="bold">Ocean shader</text><text x="44.0" y="862.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">foamRT = tex2D(_FoamRT, xz / 500)</text><text x="44.0" y="888.6" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">foam = step(pattern, foamRT × 0.45)</text><text x="30.0" y="980.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">Runs in LateUpdate, once per frame. No</text><text x="30.0" y="1007.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">advection: foam does not move; trails appear</text><text x="30.0" y="1034.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">because crests move on and what they leave</text><text x="30.0" y="1061.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">fades out. A copy is drawn 256 × 256 in the</text><text x="30.0" y="1088.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">corner as a debug view.</text></svg>