<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">What goes into the colour</title><desc id="d">The fragment shader adds base colour, a fake subsurface term, a stepped specular, a fresnel-weighted cubemap reflection and a rim light, then blends to the foam colour and finally to the sky cubemap with distance.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="960" height="480" rx="14" fill="#111"/><text x="30.0" y="44.0" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">What goes into the colour</text><rect x="30.0" y="70.0" width="900.0" height="42.0" rx="8" fill="#141c19" stroke="#4ad8ff" stroke-width="1.6"/><text x="48.0" y="97.0" font-size="17" fill="#4ad8ff" text-anchor="start" font-weight="bold">base</text><text x="200.0" y="97.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">lerp(shallow, deep) by world height y</text><rect x="30.0" y="122.0" width="900.0" height="42.0" rx="8" fill="#141c19" stroke="#7dffb0" stroke-width="1.6"/><text x="48.0" y="149.0" font-size="17" fill="#7dffb0" text-anchor="start" font-weight="bold">+ SSS</text><text x="200.0" y="149.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">fake SSS: glow scaled by height, strongest looking towards the sun</text><rect x="30.0" y="174.0" width="900.0" height="42.0" rx="8" fill="#141c19" stroke="#ffd24a" stroke-width="1.6"/><text x="48.0" y="201.0" font-size="17" fill="#ffd24a" text-anchor="start" font-weight="bold">+ specular</text><text x="200.0" y="201.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">step(0.7, pow(H·N, 64)) × 0.8 → hard glints</text><rect x="30.0" y="226.0" width="900.0" height="42.0" rx="8" fill="#141c19" stroke="#5a8cff" stroke-width="1.6"/><text x="48.0" y="253.0" font-size="17" fill="#5a8cff" text-anchor="start" font-weight="bold">+ reflection</text><text x="200.0" y="253.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">cubemap × lerp(0.25, 1, fresnel) × 0.5</text><rect x="30.0" y="278.0" width="900.0" height="42.0" rx="8" fill="#141c19" stroke="#c77dff" stroke-width="1.6"/><text x="48.0" y="305.0" font-size="17" fill="#c77dff" text-anchor="start" font-weight="bold">+ rim</text><text x="200.0" y="305.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">pow(1 − N·V, 3.5) × 0.6</text><rect x="30.0" y="330.0" width="900.0" height="42.0" rx="8" fill="#141c19" stroke="#e6e6e6" stroke-width="1.6"/><text x="48.0" y="357.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">→ foam</text><text x="200.0" y="357.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">lerp to foam colour where the foam step passes</text><rect x="30.0" y="382.0" width="900.0" height="42.0" rx="8" fill="#141c19" stroke="#a8a8a8" stroke-width="1.6"/><text x="48.0" y="409.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="bold">→ fog</text><text x="200.0" y="409.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">lerp to the sky cubemap, saturate((dist / 120)^1.5)</text><text x="30.0" y="454.0" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">No N·L diffuse term and no shadows: the shape reads from the specular, reflection, rim and foam.</text></svg>