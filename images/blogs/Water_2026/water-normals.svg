"3.5" marker-end="url(#ah)"/><text x="110.5" y="-90.0" font-size="17" fill="#ffd24a" text-anchor="start" font-weight="bold">B</text><line x1="42.0" y1="-21.3" x2="-25.6" y2="-145.2" stroke="#ff5c5c" stroke-width="3.5" marker-end="url(#ah)"/><text x="-17.6" y="-145.2" font-size="17" fill="#ff5c5c" text-anchor="start" font-weight="bold">N</text><circle cx="42.0" cy="-21.3" r="6.0" fill="#e6e6e6"/></g></g><text x="490.0" y="100.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">T = (1,0,0) + Σ (tᵢ − (1,0,0))</text><text x="490.0" y="128.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">B = (0,0,1) + Σ (bᵢ − (0,0,1))</text><text x="490.0" y="156.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">N = normalize(cross(B, T))</text><text x="490.0" y="184.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">if (N.y &lt; 0) N = −N</text><text x="490.0" y="230.0" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">Each wave adds how much it tilts the surface</text><text x="490.0" y="253.0" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">in x (T) and in z (B), in the same loop that</text><text x="490.0" y="276.0" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">moves the vertex: no neighbour samples. Small</text><text x="490.0" y="299.0" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">detail comes later from two scrolling normal maps.</text><text x="40.0" y="460.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">tᵢ = (1 − QkA·Dx²·sinθ,  Dx·kA·cosθ,  −QkA·Dx·Dy·sinθ)</text><text x="40.0" y="482.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">bᵢ = (−QkA·Dx·Dy·sinθ,  Dy·kA·cosθ,  1 − QkA·Dy²·sinθ)</text></svg>