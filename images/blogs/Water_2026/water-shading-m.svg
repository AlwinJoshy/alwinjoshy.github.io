<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">What goes into the colour</title><desc id="d">The fragment shader adds base colour, a fake subsurface term, a stepped specular, a fresnel-weighted cubemap reflection and a rim light, then blends to the foam colour and finally to the sky cubemap with distance.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="600" height="850" rx="14" fill="#111"/><text x="30.0" y="48.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">What goes into the colour</text><rect x="20.0" y="76.0" width="560.0" height="80.0" rx="8" fill="#141c19" stroke="#4ad8ff" stroke-width="1.6"/><text x="36.0" y="106.0" font-size="21" fill="#4ad8ff" text-anchor="start" font-weight="bold">base</text><text x="36.0" y="136.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">lerp(shallow, deep) by world height y</text><rect x="20.0" y="168.0" width="560.0" height="80.0" rx="8" fill="#141c19" stroke="#7dffb0" stroke-width="1.6"/><text x="36.0" y="198.0" font-size="21" fill="#7dffb0" text-anchor="start" font-weight="bold">+ SSS</text><text x="36.0" y="228.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">fake SSS: glow scaled by height, strongest looking towards the sun</text><rect x="20.0" y="260.0" width="560.0" height="80.0" rx="8" fill="#141c19" stroke="#ffd24a" stroke-width="1.6"/><text x="36.0" y="290.0" font-size="21" fill="#ffd24a" text-anchor="start" font-weight="bold">+ specular</text><text x="36.0" y="320.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">step(0.7, pow(H·N, 64)) × 0.8 → hard glints</text><rect x="20.0" y="352.0" width="560.0" height="80.0" rx="8" fill="#141c19" stroke="#5a8cff" stroke-width="1.6"/><text x="36.0" y="382.0" font-size="21" fill="#5a8cff" text-anchor="start" font-weight="bold">+ reflection</text><text x="36.0" y="412.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">cubemap × lerp(0.25, 1, fresnel) × 0.5</text><rect x="20.0" y="444.0" width="560.0" height="80.0" rx="8" fill="#141c19" stroke="#c77dff" stroke-width="1.6"/><text x="36.0" y="474.0" font-size="21" fill="#c77dff" text-anchor="start" font-weight="bold">+ rim</text><text x="36.0" y="504.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">pow(1 − N·V, 3.5) × 0.6</text><rect x="20.0" y="536.0" width="560.0" height="80.0" rx="8" fill="#141c19" stroke="#e6e6e6" stroke-width="1.6"/><text x="36.0" y="566.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">→ foam</text><text x="36.0" y="596.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">lerp to foam colour where the foam step passes</text><rect x="20.0" y="628.0" width="560.0" height="80.0" rx="8" fill="#141c19" stroke="#a8a8a8" stroke-width="1.6"/><text x="36.0" y="658.0" font-size="21" fill="#a8a8a8" text-anchor="start" font-weight="bold">→ fog</text><text x="36.0" y="688.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">lerp to the sky cubemap, saturate((dist / 120)^1.5)</text><text x="30.0" y="750.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">No N·L diffuse term and no shadows:</text><text x="30.0" y="777.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">the shape reads from the specular,</text><text x="30.0" y="804.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">reflection, rim and foam.</text></svg>