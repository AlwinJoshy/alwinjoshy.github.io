<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Foam: one render texture fed back into itself</title><desc id="d">Each frame the previous foam texture is drawn through the FoamBlit shader into a second texture, which fades the old foam and adds new foam where the waves are compressed; the two textures are swapped, and the ocean shader reads the result.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="960" height="570" rx="14" fill="#111"/><text x="30.0" y="44.0" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">Foam: one render texture fed back into itself</text><rect x="30.0" y="80.0" width="250.0" height="110.0" rx="8" fill="#141c19" stroke="#ff5c5c" stroke-width="2"/><text x="44.0" y="105.0" font-size="16" fill="#ff5c5c" text-anchor="start" font-weight="bold">foamRT (last frame)</text><text x="44.0" y="132.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">1024 × 1024, R16</text><text x="44.0" y="151.6" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">covers world x,z 0 → 500</text><rect x="355.0" y="70.0" width="300.0" height="230.0" rx="8" fill="#141c19" stroke="#38de2c" stroke-width="2"/><text x="369.0" y="95.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="bold">FoamBlit shader</text><text x="369.0" y="122.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">for every texel:</text><text x="369.0" y="141.6" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">  evaluate all waves at x,z</text><text x="369.0" y="161.2" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">  ridge = compression</text><text x="369.0" y="180.8" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">        × leading × noise</text><text x="369.0" y="200.4" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">  foam = saturate(prev × 0.985</text><text x="369.0" y="220.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">          + ridge × 1.5)</text><text x="369.0" y="239.6" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">  border 1 % → 0</text><rect x="730.0" y="80.0" width="200.0" height="110.0" rx="8" fill="#141c19" stroke="#ff5c5c" stroke-width="2"/><text x="744.0" y="105.0" font-size="16" fill="#ff5c5c" text-anchor="start" font-weight="bold">foamRTTemp</text><text x="744.0" y="132.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">new foam values</text><text x="744.0" y="151.6" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">(red channel)</text><line x1="280.0" y1="135.0" x2="353.0" y2="135.0" stroke="#a8a8a8" stroke-width="2.2" marker-end="url(#ah)"/><text x="284.0" y="124.0" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">Graphics.Blit</text><line x1="655.0" y1="135.0" x2="728.0" y2="135.0" stroke="#a8a8a8" stroke-width="2.2" marker-end="url(#ah)"/><path d="M 830 190 L 830 360 L 155 360 L 155 192" fill="none" stroke="#ffd24a" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="7 5"/><text x="492.0" y="382.0" font-size="15" fill="#ffd24a" text-anchor="middle" font-weight="normal">swap the two textures → next frame starts from this result</text><rect x="30.0" y="420.0" width="350.0" height="120.0" rx="8" fill="#141c19" stroke="#4ad8ff" stroke-width="2"/><text x="44.0" y="445.0" font-size="16" fill="#4ad8ff" text-anchor="start" font-weight="bold">Ocean shader</text><text x="44.0" y="472.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">foamRT = tex2D(_FoamRT, xz / 500)</text><text x="44.0" y="491.6" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">foam = step(pattern, foamRT × 0.45)</text><rect x="420.0" y="420.0" width="230.0" height="120.0" rx="8" fill="#141c19" stroke="#a8a8a8" stroke-width="2"/><text x="434.0" y="445.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="bold">Debug view (OnGUI)</text><text x="434.0" y="472.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">copy of the texture drawn</text><text x="434.0" y="491.6" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">256 × 256 in the corner</text><line x1="155.0" y1="362.0" x2="155.0" y2="418.0" stroke="#4ad8ff" stroke-width="2.2" marker-end="url(#ah)"/><path d="M 155 395 L 535 395 L 535 418" fill="none" stroke="#a8a8a8" stroke-width="1.8" marker-end="url(#ah)"/><text x="680.0" y="450.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">Runs in LateUpdate, once per frame.</text><text x="680.0" y="471.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">No advection: foam does not move;</text><text x="680.0" y="492.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">trails appear because the crests move</text><text x="680.0" y="513.0" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">on and what they leave fades out.</text></svg>