<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="260" rx="14" fill="#111"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7a5a"/></marker></defs>
  <g fill="#1c1c1c" stroke="#ff7a5a" stroke-width="1.5">
    <rect x="30" y="70" width="180" height="110" rx="10"/><rect x="250" y="70" width="180" height="110" rx="10"/>
    <rect x="470" y="70" width="180" height="110" rx="10"/><rect x="690" y="70" width="180" height="110" rx="10"/>
  </g>
  <g stroke="#ff7a5a" stroke-width="2" marker-end="url(#a)"><line x1="212" y1="125" x2="246" y2="125"/><line x1="432" y1="125" x2="466" y2="125"/><line x1="652" y1="125" x2="686" y2="125"/></g>
  <g fill="#fff" font-size="17" font-weight="bold" text-anchor="middle">
    <text x="120" y="105">Scene lights</text><text x="340" y="105">Voxel grid bake</text><text x="560" y="105">3D texture</text><text x="780" y="105">Shader sampling</text>
  </g>
  <g fill="#bbb" font-size="13" text-anchor="middle">
    <text x="120" y="132">point, spot and</text><text x="120" y="150">directional</text>
    <text x="340" y="132">gather nearest lights</text><text x="340" y="150">+ jittered shadow rays</text>
    <text x="560" y="132">RGBA8, clamp,</text><text x="560" y="150">hardware filtering</text>
    <text x="780" y="132">world pos to UVW,</text><text x="780" y="150">one fetch per pixel</text>
