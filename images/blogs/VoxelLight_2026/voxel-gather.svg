<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="420" rx="14" fill="#111"/>
  <g stroke="#2a2a2a" stroke-width="1">
    <path d="M60 60V380M140 60V380M220 60V380M300 60V380M380 60V380M460 60V380"/>
    <path d="M60 60H460M60 140H460M60 220H460M60 300H460M60 380H460"/>
  </g>
  <rect x="220" y="220" width="80" height="80" fill="#ff7a5a" fill-opacity="0.12" stroke="#ff7a5a" stroke-width="1.5"/>
  <circle cx="220" cy="300" r="6" fill="#ff7a5a"/>
  <text x="150" y="325" fill="#ff7a5a" font-size="13">sample point</text>
  <!-- lights -->
  <circle cx="700" cy="110" r="16" fill="#ffd27a"/><text x="725" y="115" fill="#ddd" font-size="14">light A (in range)</text>
  <circle cx="760" cy="330" r="16" fill="#7ad6ff"/><text x="785" y="335" fill="#ddd" font-size="14">light B</text>
  <circle cx="840" cy="40" r="10" fill="#555"/><text x="700" y="44" fill="#777" font-size="12">out of range / over cap</text>
  <!-- occluder -->
  <rect x="470" y="150" width="34" height="110" rx="4" fill="#3a3a3a"/><text x="455" y="282" fill="#999" font-size="12">occluder</text>
  <!-- rays to A: some blocked -->
  <g stroke-width="1.6" fill="none">
    <line x1="226" y1="296" x2="694" y2="114" stroke="#ffd27a"/>
    <line x1="226" y1="296" x2="680" y2="80" stroke="#ffd27a" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <line x1="226" y1="296" x2="480" y2="190" stroke="#ff7a5a"/>
    <line x1="226" y1="296" x2="478" y2="230" stroke="#ff7a5a"/>
  </g>
  <g fill="#ff7a5a"><circle cx="480" cy="190" r="4"/><circle cx="478" cy="230" r="4"/></g>
  <line x1="226" y1="300" x2="742" y2="328" stroke="#7ad6ff" stroke-width="1.6"/>
  <g fill="#ccc" font-size="14">
    <text x="60" y="36">One voxel, several jittered rays per light</text>
  </g>
  <g fill="#aaa" font-size="13">
    <text x="530" y="200">hit: adds to shadow density</text>
    <text x="520" y="385">shadow = hits / samples, light fades by that</text>
    <text x="520" y="405">attenuation = (1 - d / range) ^ exponent</text>
  </g>
</svg>
