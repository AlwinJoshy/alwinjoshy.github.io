<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Trebuchet MS, Arial, sans-serif">
  <rect width="900" height="300" rx="12" fill="#141414"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2eaa25"/></marker></defs>
  <g font-size="15" fill="#fff" text-anchor="middle">
    <rect x="20" y="40" width="190" height="200" rx="10" fill="#1f1f1f" stroke="#333"/>
    <text x="115" y="66" font-weight="bold">RenderPass</text>
    <text x="115" y="96" font-size="13" fill="#cfcfcf">sky triangle (equirect HDR)</text>
    <text x="115" y="118" font-size="13" fill="#cfcfcf">terrain tiles + sky fog</text>
    <text x="115" y="140" font-size="13" fill="#cfcfcf">cloud shadows, detail tex</text>
    <text x="115" y="162" font-size="13" fill="#cfcfcf">Spitfire + trails</text>
    <text x="115" y="184" font-size="13" fill="#cfcfcf">clouds (1 instanced draw)</text>
    <text x="115" y="218" font-size="12" fill="#2eaa25">ACES tone mapping</text>
    <rect x="260" y="95" width="140" height="90" rx="10" fill="#1f1f1f" stroke="#333"/>
    <text x="330" y="125" font-weight="bold">Half-float</text>
    <text x="330" y="147" font-size="13" fill="#cfcfcf">render target</text>
    <text x="330" y="167" font-size="12" fill="#cfcfcf">(8-bit on low tier)</text>
    <rect x="450" y="95" width="160" height="90" rx="10" fill="#1f1f1f" stroke="#333"/>
    <text x="530" y="125" font-weight="bold">UnrealBloom</text>
    <text x="530" y="147" font-size="13" fill="#cfcfcf">threshold 0.62</text>
    <text x="530" y="167" font-size="13" fill="#ff7a5a">red-orange tint</text>
    <rect x="660" y="80" width="220" height="120" rx="10" fill="#1f1f1f" stroke="#2eaa25"/>
    <text x="770" y="108" font-weight="bold">Grade pass (final)</text>
    <text x="770" y="130" font-size="13" fill="#cfcfcf">warm/cool split, lift, sun glow</text>
    <text x="770" y="150" font-size="13" fill="#cfcfcf">vignette → sRGB encode</text>
    <text x="770" y="170" font-size="13" fill="#cfcfcf">→ ±0.5/255 dither</text>
    <text x="770" y="245" font-size="13" fill="#cfcfcf">then: lens flare overlay drawn on top</text>
  </g>
  <g stroke="#2eaa25" stroke-width="2.5" marker-end="url(#a)">
    <line x1="212" y1="140" x2="256" y2="140"/><line x1="402" y1="140" x2="446" y2="140"/><line x1="612" y1="140" x2="656" y2="140"/>
    <line x1="770" y1="202" x2="770" y2="228"/>
  </g>
</svg>
