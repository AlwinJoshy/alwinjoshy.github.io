<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 938" width="600" height="938" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">How bounce lighting works</title><desc id="d">Left: sunlight hits light sand in front of a shaded porch; dashed arrows show light bouncing up into the shadowed porch, tinted with the sand colour. Right: typical albedo of fresh snow, dry sand, grass and dark wood as bars, showing that brighter and more saturated materials bounce more light, and more coloured light, into the shadows.</desc><rect width="600" height="938" rx="14" fill="#111"/><text x="30" y="44" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">Bounce light: every lit surface</text><text x="30" y="78" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">becomes a light</text><defs><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ffd27a"/></marker><marker id="m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#e0b98a"/></marker></defs><rect x="30" y="110" width="540" height="360" rx="10" fill="#181818" stroke="#2a2a2a"/><rect x="31" y="400" width="538" height="69" fill="#a08a66" fill-opacity=".55"/><text x="46" y="444" font-size="19" fill="#e0c9a3" text-anchor="start" font-weight="normal">sunlit ground (warm sand)</text><rect x="73.2" y="200" width="248" height="14" fill="#6b4a33"/><rect x="73.2" y="214" width="18" height="186" fill="#5a3e2b"/><rect x="91.2" y="214" width="230" height="186" fill="#2a3346" fill-opacity=".55"/><text x="101.2" y="242" font-size="19" fill="#9cc7ff" text-anchor="start" font-weight="normal">porch in shadow</text><line x1="530" y1="130" x2="405.0" y2="396" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#m1)"/><line x1="540" y1="138" x2="431.0" y2="396" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#m1)"/><line x1="550" y1="146" x2="457.0" y2="396" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#m1)"/><line x1="435.0" y1="398" x2="285.0" y2="290" stroke="#e0b98a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m2)"/><line x1="435.0" y1="398" x2="225.0" y2="340" stroke="#e0b98a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m2)"/><line x1="435.0" y1="398" x2="315.0" y2="240" stroke="#e0b98a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m2)"/><text x="46" y="140" font-size="20" fill="#ffd27a" text-anchor="start" font-weight="normal">Direct sun</text><text x="46" y="165" font-size="20" fill="#e0b98a" text-anchor="start" font-weight="normal">Bounce: tinted by the ground</text><rect x="30" y="494" width="540" height="420" rx="10" fill="#181818" stroke="#2a2a2a"/><text x="46" y="524" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">Albedo decides how much comes back</text><text x="46" y="555" font-size="20" fill="#38de2c" text-anchor="start" font-weight="normal">bounce ≈ light in × surface colour</text><rect x="46" y="594" width="34" height="34" rx="6" fill="#eef2f6" stroke="#444"/><text x="90" y="608" font-size="20" fill="#e6e6e6" text-anchor="start" font-weight="normal">Fresh snow</text><rect x="90" y="616" width="314" height="10" rx="3" fill="#eef2f6"/><text x="412.5" y="626" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">~85%</text><rect x="46" y="656" width="34" height="34" rx="6" fill="#c8b48a" stroke="#444"/><text x="90" y="670" font-size="20" fill="#e6e6e6" text-anchor="start" font-weight="normal">Dry sand</text><rect x="90" y="678" width="148" height="10" rx="3" fill="#c8b48a"/><text x="246.0" y="688" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">~40%</text><rect x="46" y="718" width="34" height="34" rx="6" fill="#5d7a3a" stroke="#444"/><text x="90" y="732" font-size="20" fill="#e6e6e6" text-anchor="start" font-weight="normal">Grass</text><rect x="90" y="740" width="92" height="10" rx="3" fill="#5d7a3a"/><text x="190.5" y="750" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">~25%</text><rect x="46" y="780" width="34" height="34" rx="6" fill="#4a3324" stroke="#444"/><text x="90" y="794" font-size="20" fill="#e6e6e6" text-anchor="start" font-weight="normal">Dark wood</text><rect x="90" y="802" width="44" height="10" rx="3" fill="#4a3324"/><text x="142.4" y="812" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">~12%</text><text x="46" y="868" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">Typical real-world albedo. Brighter, more</text><text x="46" y="894" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">saturated surfaces bounce more colour.</text></svg>