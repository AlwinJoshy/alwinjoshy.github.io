<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" width="960" height="584" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Sun height and colour temperature across the day</title><desc id="d">A sun arc over the horizon. Dawn and dusk suns sit low and are warm, about 2,000 to 3,500 kelvin; the noon sun is high and near white, about 5,500 kelvin; at night the moon replaces the sun and reads cool blue. Each time of day shows the sky colour sampled from the matching render, above a warm-to-cool colour temperature scale.</desc><rect width="960" height="584" rx="14" fill="#111"/><text x="30" y="44" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">Sun height and colour across the day</text><defs><linearGradient id="skyg" x1="0" x2="1"><stop offset="0" stop-color="#2f4a7a"/><stop offset=".5" stop-color="#527cc6"/><stop offset="1" stop-color="#ab7b60"/></linearGradient></defs><path d="M60.0,280 A420.0,175 0 0 1 900.0,280 Z" fill="url(#skyg)" fill-opacity=".22"/><path d="M60.0,280 A420.0,175 0 0 1 900.0,280" fill="none" stroke="#555" stroke-dasharray="6 6" stroke-width="2"/><line x1="30" y1="280" x2="930" y2="280" stroke="#777" stroke-width="2"/><text x="926" y="302" font-size="13" fill="#a8a8a8" text-anchor="end" font-weight="normal">horizon</text><circle cx="64" cy="256" r="25" fill="#ffb46b" fill-opacity=".18"/><circle cx="64" cy="256" r="15" fill="#ffb46b"/><text x="64.08741112854045" y="229.64470733198857" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Dawn</text><circle cx="480" cy="105" r="28" fill="#fff1dc" fill-opacity=".18"/><circle cx="480" cy="105" r="18" fill="#fff1dc"/><text x="480.0" y="75.0" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Noon</text><circle cx="896" cy="256" r="25" fill="#ff8a3d" fill-opacity=".18"/><circle cx="896" cy="256" r="15" fill="#ff8a3d"/><text x="895.9125888714595" y="229.64470733198854" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Dusk</text><circle cx="288" cy="172" r="13" fill="#cfdcff"/><circle cx="294" cy="168" r="12" fill="#1a2233"/><text x="288.0" y="149.5" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Night: moon</text><text x="480.0" y="302" font-size="13" fill="#a8a8a8" text-anchor="middle" font-weight="normal">below the horizon at night, the sun only lights the sky faintly</text><rect x="30" y="324" width="210" height="150" rx="10" fill="#181818" stroke="#2a2a2a"/><circle cx="52" cy="350" r="9" fill="#ffb46b"/><text x="70" y="356" font-size="16" fill="#38de2c" text-anchor="start" font-weight="bold">Dawn</text><rect x="166" y="336" width="58" height="28" rx="6" fill="#2f4a7a" stroke="#444"/><text x="195" y="382" font-size="12" fill="#a8a8a8" text-anchor="middle" font-weight="normal">sky in render</text><text x="46" y="406" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">Sun just over the horizon</text><text x="46" y="424.85" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">~2,500–3,500 K, long shadows</text><text x="46" y="443.7" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">Sky is the main light: cool, soft</text><rect x="250" y="324" width="210" height="150" rx="10" fill="#181818" stroke="#2a2a2a"/><circle cx="272" cy="350" r="9" fill="#fff1dc"/><text x="290" y="356" font-size="16" fill="#38de2c" text-anchor="start" font-weight="bold">Noon</text><rect x="386" y="336" width="58" height="28" rx="6" fill="#527cc6" stroke="#444"/><text x="415" y="382" font-size="12" fill="#a8a8a8" text-anchor="middle" font-weight="normal">sky in render</text><text x="266" y="406" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">Sun high overhead</text><text x="266" y="424.85" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">~5,000–5,800 K, hard shadows</text><text x="266" y="443.7" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">Sky adds blue fill in shade</text><rect x="470" y="324" width="210" height="150" rx="10" fill="#181818" stroke="#2a2a2a"/><circle cx="492" cy="350" r="9" fill="#ff8a3d"/><text x="510" y="356" font-size="16" fill="#38de2c" text-anchor="start" font-weight="bold">Dusk</text><rect x="606" y="336" width="58" height="28" rx="6" fill="#ab7b60" stroke="#444"/><text x="635" y="382" font-size="12" fill="#a8a8a8" text-anchor="middle" font-weight="normal">sky in render</text><text x="486" y="406" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">Sun low, about to set</text><text x="486" y="424.85" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">~1,800–3,000 K, long warm light</text><text x="486" y="443.7" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">Sky warm near the sun</text><rect x="690" y="324" width="210" height="150" rx="10" fill="#181818" stroke="#2a2a2a"/><circle cx="712" cy="350" r="9" fill="#cfdcff"/><text x="730" y="356" font-size="16" fill="#38de2c" text-anchor="start" font-weight="bold">Night</text><rect x="826" y="336" width="58" height="28" rx="6" fill="#16171d" stroke="#444"/><text x="855" y="382" font-size="12" fill="#a8a8a8" text-anchor="middle" font-weight="normal">sky in render</text><text x="706" y="406" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">Moon instead of sun</text><text x="706" y="424.85" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">Moonlight is reflected sunlight</text><text x="706" y="443.7" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">Reads blue in low light</text><defs><linearGradient id="kb"><stop offset="0.000" stop-color="#ff7e00"/><stop offset="0.049" stop-color="#ff9227"/><stop offset="0.098" stop-color="#ffa24f"/><stop offset="0.146" stop-color="#ffb16d"/><stop offset="0.195" stop-color="#ffbd87"/><stop offset="0.244" stop-color="#ffc89c"/><stop offset="0.293" stop-color="#ffd2af"/><stop offset="0.341" stop-color="#ffdbbf"/><stop offset="0.390" stop-color="#ffe4cd"/><stop offset="0.439" stop-color="#ffebdb"/><stop offset="0.488" stop-color="#fff2e7"/><stop offset="0.537" stop-color="#fff9f2"/><stop offset="0.585" stop-color="#ffffff"/><stop offset="0.634" stop-color="#f2f2ff"/><stop offset="0.683" stop-color="#e7ecff"/><stop offset="0.732" stop-color="#e0e7ff"/><stop offset="0.780" stop-color="#dae4ff"/><stop offset="0.829" stop-color="#d5e1ff"/><stop offset="0.878" stop-color="#d1deff"/><stop offset="0.927" stop-color="#cedcff"/><stop offset="0.976" stop-color="#cbdaff"/></linearGradient></defs><rect x="30" y="524" width="900" height="16" rx="8.0" fill="url(#kb)"/><line x1="52" y1="540" x2="52" y2="546" stroke="#a8a8a8"/><text x="51.951219512195124" y="559" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="normal">2,000 K</text><line x1="217" y1="540" x2="217" y2="546" stroke="#a8a8a8"/><text x="216.58536585365854" y="559" font-size="13" fill="#a8a8a8" text-anchor="middle" font-weight="normal">3,500 K</text><line x1="436" y1="540" x2="436" y2="546" stroke="#a8a8a8"/><text x="436.0975609756098" y="559" font-size="13" fill="#a8a8a8" text-anchor="middle" font-weight="normal">5,500 K</text><line x1="930" y1="540" x2="930" y2="546" stroke="#a8a8a8"/><text x="930.0" y="559" font-size="13" fill="#a8a8a8" text-anchor="end" font-weight="normal">10,000 K</text><text x="30" y="514" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="normal">Colour temperature: warm (low K) to cool (high K)</text></svg>