<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Reflections follow the sky through the day</title><desc id="d">Left: a camera looks at a pond at a low angle and the reflected ray goes up to the sky, so the water shows the sky. Right: the Fresnel curve for water, about 2 percent reflection looking straight down rising to 100 percent at grazing angles, and four swatches of the sky colour sampled from the dawn, noon, dusk and night renders.</desc><rect width="960" height="400" rx="14" fill="#111"/><text x="30" y="44" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">Water and gloss reflect the sky, so they change with it</text><defs><marker id="m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ccc"/></marker></defs><rect x="30" y="70" width="520" height="300" rx="10" fill="#181818" stroke="#2a2a2a"/><rect x="31" y="300" width="518" height="69" fill="#1e3a44"/><text x="46" y="350" font-size="13" fill="#8fc3d1" text-anchor="start" font-weight="normal">pond surface</text><circle cx="80" cy="220" r="10" fill="none" stroke="#ccc" stroke-width="2"/><circle cx="83" cy="220" r="4" fill="#ccc"/><text x="74" y="202" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="normal">camera</text><line x1="92" y1="226" x2="290.0" y2="300" stroke="#ccc" stroke-width="2" marker-end="url(#m3)"/><line x1="290.0" y1="300" x2="490" y2="210" stroke="#ccc" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m3)"/><text x="481.5" y="198" font-size="13" fill="#a8a8a8" text-anchor="end" font-weight="normal">sees the sky</text><text x="46" y="102" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">At a low angle, water is mostly a mirror</text><rect x="570" y="70" width="360" height="300" rx="10" fill="#181818" stroke="#2a2a2a"/><text x="586" y="102" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="bold">Fresnel: reflection vs angle</text><line x1="620" y1="260" x2="900" y2="260" stroke="#666"/><line x1="620" y1="260" x2="620" y2="130" stroke="#666"/><polyline points="620.0,257.4 623.1,257.4 626.2,257.4 629.3,257.4 632.4,257.4 635.6,257.4 638.7,257.4 641.8,257.4 644.9,257.4 648.0,257.4 651.1,257.4 654.2,257.4 657.3,257.4 660.4,257.4 663.6,257.4 666.7,257.4 669.8,257.4 672.9,257.4 676.0,257.4 679.1,257.4 682.2,257.4 685.3,257.4 688.4,257.4 691.6,257.3 694.7,257.3 697.8,257.3 700.9,257.3 704.0,257.3 707.1,257.3 710.2,257.3 713.3,257.3 716.4,257.2 719.6,257.2 722.7,257.2 725.8,257.1 728.9,257.1 732.0,257.1 735.1,257.0 738.2,257.0 741.3,256.9 744.4,256.9 747.6,256.8 750.7,256.7 753.8,256.6 756.9,256.5 760.0,256.4 763.1,256.3 766.2,256.2 769.3,256.0 772.4,255.9 775.6,255.7 778.7,255.5 781.8,255.3 784.9,255.0 788.0,254.7 791.1,254.4 794.2,254.1 797.3,253.7 800.4,253.3 803.6,252.8 806.7,252.3 809.8,251.7 812.9,251.1 816.0,250.4 819.1,249.6 822.2,248.8 825.3,247.8 828.4,246.7 831.6,245.5 834.7,244.2 837.8,242.8 840.9,241.1 844.0,239.3 847.1,237.3 850.2,235.0 853.3,232.5 856.4,229.7 859.6,226.6 862.7,223.1 865.8,219.2 868.9,214.9 872.0,210.1 875.1,204.6 878.2,198.6 881.3,191.8 884.4,184.2 887.6,175.8 890.7,166.2 893.8,155.5 896.9,143.5 900.0,130.0" fill="none" stroke="#38de2c" stroke-width="3"/><text x="620" y="280" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">looking down</text><text x="900" y="280" font-size="12" fill="#a8a8a8" text-anchor="end" font-weight="normal">grazing</text><text x="612" y="134" font-size="12" fill="#a8a8a8" text-anchor="end" font-weight="normal">100%</text><text x="612" y="260" font-size="12" fill="#a8a8a8" text-anchor="end" font-weight="normal">~2%</text><text x="586" y="306" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">Sky colour sampled from each render:</text><rect x="586" y="316" width="72" height="22" rx="4" fill="#2f4a7a" stroke="#444"/><text x="586.0" y="353" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">Dawn</text><rect x="668" y="316" width="72" height="22" rx="4" fill="#527cc6" stroke="#444"/><text x="668.0" y="353" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">Noon</text><rect x="750" y="316" width="72" height="22" rx="4" fill="#ab7b60" stroke="#444"/><text x="750.0" y="353" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">Dusk</text><rect x="832" y="316" width="72" height="22" rx="4" fill="#16171d" stroke="#444"/><text x="832.0" y="353" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">Night</text></svg>