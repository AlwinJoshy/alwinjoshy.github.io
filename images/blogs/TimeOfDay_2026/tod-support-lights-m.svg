<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 873" width="600" height="873" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Support lights separate the cabin from the background</title><desc id="d">Two schematic night scenes. Without support lights the cabin and the dark forest have almost the same value and merge. With a spot light on the facade, an area light glow at the window and a warm pool from the lamp post, the cabin is clearly brighter and warmer than the background. Key is the sun or moon, fill is sky ambient and bounce, and separation comes from the spot and area lights.</desc><rect width="600" height="873" rx="14" fill="#111"/><text x="30" y="44" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">Support lights: separating</text><text x="30" y="78" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">the cabin from the forest</text><rect x="30" y="110" width="540" height="300" rx="10" fill="#0d1210" stroke="#2a2a2a"/><text x="46" y="142" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">Sky + moon only</text><path d="M24,350 L50,240 L76,350z" fill="#18241c"/><path d="M86,350 L112,203 L138,350z" fill="#18241c"/><path d="M149,350 L175,226 L201,350z" fill="#18241c"/><path d="M212,350 L238,189 L264,350z" fill="#18241c"/><path d="M274,350 L300,212 L326,350z" fill="#18241c"/><path d="M336,350 L362,235 L388,350z" fill="#18241c"/><path d="M399,350 L425,198 L451,350z" fill="#18241c"/><path d="M462,350 L488,221 L514,350z" fill="#18241c"/><path d="M524,350 L550,184 L576,350z" fill="#18241c"/><rect x="31" y="350" width="538" height="59" fill="#151a17"/><rect x="220.0" y="280" width="110" height="70" fill="#2a211b"/><path d="M208.0,280 L275.0,238 L342.0,280z" fill="#25282c"/><rect x="240.0" y="298" width="26" height="22" fill="#3a2a1c"/><rect x="368.0" y="296" width="4" height="54" fill="#3b2a20"/><circle cx="370.0" cy="294" r="5" fill="#3a2a1c"/><text x="46" y="386" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">cabin</text><rect x="124" y="372" width="50" height="18" fill="#2b2420" stroke="#444"/><text x="208.5" y="386" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">background</text><rect x="345" y="372" width="50" height="18" fill="#1a221d" stroke="#444"/><text x="554" y="386" font-size="19" fill="#ff7a5a" text-anchor="end" font-weight="normal">merge</text><rect x="30" y="430" width="540" height="300" rx="10" fill="#0d1210" stroke="#2a2a2a"/><text x="46" y="462" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">+ support lights on the cabin</text><path d="M24,670 L50,560 L76,670z" fill="#18241c"/><path d="M86,670 L112,523 L138,670z" fill="#18241c"/><path d="M149,670 L175,546 L201,670z" fill="#18241c"/><path d="M212,670 L238,509 L264,670z" fill="#18241c"/><path d="M274,670 L300,532 L326,670z" fill="#18241c"/><path d="M336,670 L362,555 L388,670z" fill="#18241c"/><path d="M399,670 L425,518 L451,670z" fill="#18241c"/><path d="M462,670 L488,541 L514,670z" fill="#18241c"/><path d="M524,670 L550,504 L576,670z" fill="#18241c"/><rect x="31" y="670" width="538" height="59" fill="#151a17"/><path d="M420.0,474 L250.0,660 L360.0,666z" fill="#ffcf8a" fill-opacity=".10"/><circle cx="420.0" cy="474" r="8" fill="#ffcf8a"/><text x="434.0" y="479" font-size="19" fill="#ffcf8a" text-anchor="start" font-weight="normal">spot</text><rect x="220.0" y="600" width="110" height="70" fill="#5b3a26"/><path d="M208.0,600 L275.0,558 L342.0,600z" fill="#59606b"/><rect x="240.0" y="618" width="26" height="22" fill="#ffb35c"/><rect x="236.0" y="614" width="34" height="30" fill="none" stroke="#ffb35c" stroke-dasharray="3 3"/><text x="234.0" y="608" font-size="18" fill="#ffb35c" text-anchor="end" font-weight="normal">area</text><ellipse cx="370.0" cy="678" rx="60" ry="12" fill="#ff9b4a" fill-opacity=".35"/><rect x="368.0" y="616" width="4" height="54" fill="#3b2a20"/><circle cx="370.0" cy="614" r="5" fill="#ffb35c"/><text x="46" y="706" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">cabin</text><rect x="124" y="692" width="50" height="18" fill="#8a6a52" stroke="#444"/><text x="208.5" y="706" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">background</text><rect x="345" y="692" width="50" height="18" fill="#1a221d" stroke="#444"/><text x="554" y="706" font-size="19" fill="#38de2c" text-anchor="end" font-weight="normal">clear</text><text x="30" y="770" font-size="20" fill="#38de2c" text-anchor="start" font-weight="bold">Key</text><text x="165" y="770" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">sun or moon (directional)</text><text x="30" y="801" font-size="20" fill="#38de2c" text-anchor="start" font-weight="bold">Fill</text><text x="165" y="801" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">sky ambient + bounce</text><text x="30" y="832" font-size="20" fill="#38de2c" text-anchor="start" font-weight="bold">Separation</text><text x="165" y="832" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">spot / area lights</text></svg>