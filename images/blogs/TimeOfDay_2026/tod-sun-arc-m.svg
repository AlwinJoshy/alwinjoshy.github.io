<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1160" width="600" height="1160" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Sun height and colour temperature across the day</title><desc id="d">A sun arc over the horizon. Dawn and dusk suns sit low and are warm, about 2,000 to 3,500 kelvin; the noon sun is high and near white, about 5,500 kelvin; at night the moon replaces the sun and reads cool blue. Each time of day shows the sky colour sampled from the matching render, above a warm-to-cool colour temperature scale.</desc><rect width="600" height="1160" rx="14" fill="#111"/><text x="30" y="44" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">Sun height and colour</text><text x="30" y="78" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">across the day</text><defs><linearGradient id="skyg" x1="0" x2="1"><stop offset="0" stop-color="#2f4a7a"/><stop offset=".5" stop-color="#527cc6"/><stop offset="1" stop-color="#ab7b60"/></linearGradient></defs><path d="M60.0,330 A240.0,190 0 0 1 540.0,330 Z" fill="url(#skyg)" fill-opacity=".22"/><path d="M60.0,330 A240.0,190 0 0 1 540.0,330" fill="none" stroke="#555" stroke-dasharray="6 6" stroke-width="2"/><line x1="30" y1="330" x2="570" y2="330" stroke="#777" stroke-width="2"/><text x="566" y="352" font-size="19" fill="#a8a8a8" text-anchor="end" font-weight="normal">horizon</text><circle cx="62" cy="304" r="25" fill="#ffb46b" fill-opacity=".18"/><circle cx="62" cy="304" r="15" fill="#ffb46b"/><text x="62.335663502023124" y="277.5571108175876" font-size="23" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Dawn</text><circle cx="300" cy="140" r="28" fill="#fff1dc" fill-opacity=".18"/><circle cx="300" cy="140" r="18" fill="#fff1dc"/><text x="300.0" y="110.0" font-size="23" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Noon</text><circle cx="538" cy="304" r="25" fill="#ff8a3d" fill-opacity=".18"/><circle cx="538" cy="304" r="15" fill="#ff8a3d"/><text x="537.6643364979768" y="277.55711081758756" font-size="23" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Dusk</text><circle cx="180" cy="212" r="13" fill="#cfdcff"/><circle cx="186" cy="208" r="12" fill="#1a2233"/><text x="180.0" y="190.2" font-size="21" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Night: moon</text><rect x="30" y="374" width="540" height="150" rx="10" fill="#181818" stroke="#2a2a2a"/><circle cx="52" cy="400" r="9" fill="#ffb46b"/><text x="70" y="406" font-size="23" fill="#38de2c" text-anchor="start" font-weight="bold">Dawn</text><rect x="496" y="386" width="58" height="28" rx="6" fill="#2f4a7a" stroke="#444"/><text x="525" y="432" font-size="14" fill="#a8a8a8" text-anchor="middle" font-weight="normal">sky in render</text><text x="46" y="456" font-size="20" fill="#e6e6e6" text-anchor="start" font-weight="normal">Sun just over the horizon</text><text x="46" y="485.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">~2,500–3,500 K, long shadows</text><text x="46" y="514.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">Sky is the main light: cool, soft</text><rect x="30" y="538" width="540" height="150" rx="10" fill="#181818" stroke="#2a2a2a"/><circle cx="52" cy="564" r="9" fill="#fff1dc"/><text x="70" y="570" font-size="23" fill="#38de2c" text-anchor="start" font-weight="bold">Noon</text><rect x="496" y="550" width="58" height="28" rx="6" fill="#527cc6" stroke="#444"/><text x="525" y="596" font-size="14" fill="#a8a8a8" text-anchor="middle" font-weight="normal">sky in render</text><text x="46" y="620" font-size="20" fill="#e6e6e6" text-anchor="start" font-weight="normal">Sun high overhead</text><text x="46" y="649.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">~5,000–5,800 K, hard shadows</text><text x="46" y="678.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">Sky adds blue fill in shade</text><rect x="30" y="702" width="540" height="150" rx="10" fill="#181818" stroke="#2a2a2a"/><circle cx="52" cy="728" r="9" fill="#ff8a3d"/><text x="70" y="734" font-size="23" fill="#38de2c" text-anchor="start" font-weight="bold">Dusk</text><rect x="496" y="714" width="58" height="28" rx="6" fill="#ab7b60" stroke="#444"/><text x="525" y="760" font-size="14" fill="#a8a8a8" text-anchor="middle" font-weight="normal">sky in render</text><text x="46" y="784" font-size="20" fill="#e6e6e6" text-anchor="start" font-weight="normal">Sun low, about to set</text><text x="46" y="813.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">~1,800–3,000 K, long warm light</text><text x="46" y="842.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">Sky warm near the sun</text><rect x="30" y="866" width="540" height="150" rx="10" fill="#181818" stroke="#2a2a2a"/><circle cx="52" cy="892" r="9" fill="#cfdcff"/><text x="70" y="898" font-size="23" fill="#38de2c" text-anchor="start" font-weight="bold">Night</text><rect x="496" y="878" width="58" height="28" rx="6" fill="#16171d" stroke="#444"/><text x="525" y="924" font-size="14" fill="#a8a8a8" text-anchor="middle" font-weight="normal">sky in render</text><text x="46" y="948" font-size="20" fill="#e6e6e6" text-anchor="start" font-weight="normal">Moon instead of sun</text><text x="46" y="977.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">Moonlight is reflected sunlight</text><text x="46" y="1006.0" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">Reads blue in low light</text><defs><linearGradient id="kb"><stop offset="0.000" stop-color="#ff7e00"/><stop offset="0.049" stop-color="#ff9227"/><stop offset="0.098" stop-color="#ffa24f"/><stop offset="0.146" stop-color="#ffb16d"/><stop offset="0.195" stop-color="#ffbd87"/><stop offset="0.244" stop-color="#ffc89c"/><stop offset="0.293" stop-color="#ffd2af"/><stop offset="0.341" stop-color="#ffdbbf"/><stop offset="0.390" stop-color="#ffe4cd"/><stop offset="0.439" stop-color="#ffebdb"/><stop offset="0.488" stop-color="#fff2e7"/><stop offset="0.537" stop-color="#fff9f2"/><stop offset="0.585" stop-color="#ffffff"/><stop offset="0.634" stop-color="#f2f2ff"/><stop offset="0.683" stop-color="#e7ecff"/><stop offset="0.732" stop-color="#e0e7ff"/><stop offset="0.780" stop-color="#dae4ff"/><stop offset="0.829" stop-color="#d5e1ff"/><stop offset="0.878" stop-color="#d1deff"/><stop offset="0.927" stop-color="#cedcff"/><stop offset="0.976" stop-color="#cbdaff"/></linearGradient></defs><rect x="30" y="1080" width="540" height="16" rx="8.0" fill="url(#kb)"/><line x1="43" y1="1096" x2="43" y2="1102" stroke="#a8a8a8"/><text x="43.170731707317074" y="1121" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">2,000 K</text><line x1="274" y1="1096" x2="274" y2="1102" stroke="#a8a8a8"/><text x="273.6585365853658" y="1121" font-size="19" fill="#a8a8a8" text-anchor="middle" font-weight="normal">5,500 K</text><line x1="570" y1="1096" x2="570" y2="1102" stroke="#a8a8a8"/><text x="570.0" y="1121" font-size="19" fill="#a8a8a8" text-anchor="end" font-weight="normal">10,000 K</text><text x="30" y="1070" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">Colour temperature: warm (low K) to cool (high K)</text></svg>