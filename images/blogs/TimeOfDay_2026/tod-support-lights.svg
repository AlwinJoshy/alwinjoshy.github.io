<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Support lights separate the cabin from the background</title><desc id="d">Two schematic night scenes. Without support lights the cabin and the dark forest have almost the same value and merge. With a spot light on the facade, an area light glow at the window and a warm pool from the lamp post, the cabin is clearly brighter and warmer than the background. Key is the sun or moon, fill is sky ambient and bounce, and separation comes from the spot and area lights.</desc><rect width="960" height="440" rx="14" fill="#111"/><text x="30" y="44" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">Support lights: separating the cabin from the forest</text><rect x="30" y="70" width="440" height="300" rx="10" fill="#0d1210" stroke="#2a2a2a"/><text x="46" y="102" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="bold">Sky + moon only</text><path d="M24,310 L50,200 L76,310z" fill="#18241c"/><path d="M74,310 L100,163 L126,310z" fill="#18241c"/><path d="M124,310 L150,186 L176,310z" fill="#18241c"/><path d="M174,310 L200,149 L226,310z" fill="#18241c"/><path d="M224,310 L250,172 L276,310z" fill="#18241c"/><path d="M274,310 L300,195 L326,310z" fill="#18241c"/><path d="M324,310 L350,158 L376,310z" fill="#18241c"/><path d="M374,310 L400,181 L426,310z" fill="#18241c"/><path d="M424,310 L450,144 L476,310z" fill="#18241c"/><rect x="31" y="310" width="438" height="59" fill="#151a17"/><rect x="170.0" y="240" width="110" height="70" fill="#2a211b"/><path d="M158.0,240 L225.0,198 L292.0,240z" fill="#25282c"/><rect x="190.0" y="258" width="26" height="22" fill="#3a2a1c"/><rect x="318.0" y="256" width="4" height="54" fill="#3b2a20"/><circle cx="320.0" cy="254" r="5" fill="#3a2a1c"/><text x="46" y="346" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">cabin</text><rect x="106" y="332" width="50" height="18" fill="#2b2420" stroke="#444"/><text x="171" y="346" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">background</text><rect x="276" y="332" width="50" height="18" fill="#1a221d" stroke="#444"/><text x="454" y="346" font-size="13" fill="#ff7a5a" text-anchor="end" font-weight="normal">values merge</text><rect x="490" y="70" width="440" height="300" rx="10" fill="#0d1210" stroke="#2a2a2a"/><text x="506" y="102" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="bold">+ support lights on the cabin</text><path d="M484,310 L510,200 L536,310z" fill="#18241c"/><path d="M534,310 L560,163 L586,310z" fill="#18241c"/><path d="M584,310 L610,186 L636,310z" fill="#18241c"/><path d="M634,310 L660,149 L686,310z" fill="#18241c"/><path d="M684,310 L710,172 L736,310z" fill="#18241c"/><path d="M734,310 L760,195 L786,310z" fill="#18241c"/><path d="M784,310 L810,158 L836,310z" fill="#18241c"/><path d="M834,310 L860,181 L886,310z" fill="#18241c"/><path d="M884,310 L910,144 L936,310z" fill="#18241c"/><rect x="491" y="310" width="438" height="59" fill="#151a17"/><path d="M830.0,114 L660.0,300 L770.0,306z" fill="#ffcf8a" fill-opacity=".10"/><circle cx="830.0" cy="114" r="8" fill="#ffcf8a"/><text x="844.0" y="119" font-size="13" fill="#ffcf8a" text-anchor="start" font-weight="normal">spot</text><rect x="630.0" y="240" width="110" height="70" fill="#5b3a26"/><path d="M618.0,240 L685.0,198 L752.0,240z" fill="#59606b"/><rect x="650.0" y="258" width="26" height="22" fill="#ffb35c"/><rect x="646.0" y="254" width="34" height="30" fill="none" stroke="#ffb35c" stroke-dasharray="3 3"/><text x="644.0" y="248" font-size="12" fill="#ffb35c" text-anchor="end" font-weight="normal">area</text><ellipse cx="780.0" cy="318" rx="60" ry="12" fill="#ff9b4a" fill-opacity=".35"/><rect x="778.0" y="256" width="4" height="54" fill="#3b2a20"/><circle cx="780.0" cy="254" r="5" fill="#ffb35c"/><text x="506" y="346" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">cabin</text><rect x="566" y="332" width="50" height="18" fill="#8a6a52" stroke="#444"/><text x="631" y="346" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">background</text><rect x="736" y="332" width="50" height="18" fill="#1a221d" stroke="#444"/><text x="914" y="346" font-size="13" fill="#38de2c" text-anchor="end" font-weight="normal">clear contrast</text><text x="30" y="410" font-size="14" fill="#38de2c" text-anchor="start" font-weight="bold">Key</text><text x="69.0" y="410" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">sun or moon (directional)</text><text x="330" y="410" font-size="14" fill="#38de2c" text-anchor="start" font-weight="bold">Fill</text><text x="378.0" y="410" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">sky ambient + bounce</text><text x="630" y="410" font-size="14" fill="#38de2c" text-anchor="start" font-weight="bold">Separation</text><text x="732.0" y="410" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="normal">spot / area lights</text></svg>