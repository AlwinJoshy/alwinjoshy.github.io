<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">How bounce lighting works</title><desc id="d">Left: sunlight hits light sand in front of a shaded porch; dashed arrows show light bouncing up into the shadowed porch, tinted with the sand colour. Right: typical albedo of fresh snow, dry sand, grass and dark wood as bars, showing that brighter and more saturated materials bounce more light, and more coloured light, into the shadows.</desc><rect width="960" height="430" rx="14" fill="#111"/><text x="30" y="44" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">Bounce light: every lit surface becomes a light</text><defs><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ffd27a"/></marker><marker id="m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#e0b98a"/></marker></defs><rect x="30" y="70" width="520" height="330" rx="10" fill="#181818" stroke="#2a2a2a"/><rect x="31" y="330" width="518" height="69" fill="#a08a66" fill-opacity=".55"/><text x="46" y="374" font-size="13" fill="#e0c9a3" text-anchor="start" font-weight="normal">sunlit ground (warm sand)</text><rect x="71.6" y="160" width="239" height="14" fill="#6b4a33"/><rect x="71.6" y="174" width="18" height="156" fill="#5a3e2b"/><rect x="89.6" y="174" width="221" height="156" fill="#2a3346" fill-opacity=".55"/><text x="99.6" y="202" font-size="13" fill="#9cc7ff" text-anchor="start" font-weight="normal">porch in shadow</text><line x1="510" y1="90" x2="390.0" y2="326" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#m1)"/><line x1="520" y1="98" x2="416.0" y2="326" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#m1)"/><line x1="530" y1="106" x2="442.0" y2="326" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#m1)"/><line x1="420.0" y1="328" x2="270.0" y2="220" stroke="#e0b98a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m2)"/><line x1="420.0" y1="328" x2="210.0" y2="270" stroke="#e0b98a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m2)"/><line x1="420.0" y1="328" x2="300.0" y2="170" stroke="#e0b98a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m2)"/><text x="46" y="100" font-size="14" fill="#ffd27a" text-anchor="start" font-weight="normal">Direct sun</text><text x="46" y="119" font-size="14" fill="#e0b98a" text-anchor="start" font-weight="normal">Bounce: tinted by the ground</text><rect x="570" y="70" width="360" height="330" rx="10" fill="#181818" stroke="#2a2a2a"/><text x="586" y="100" font-size="16" fill="#e6e6e6" text-anchor="start" font-weight="bold">Albedo decides how much comes back</text><text x="586" y="125" font-size="14" fill="#38de2c" text-anchor="start" font-weight="normal">bounce ≈ light in × surface colour</text><rect x="586" y="150" width="34" height="34" rx="6" fill="#eef2f6" stroke="#444"/><text x="630" y="164" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">Fresh snow</text><rect x="630" y="172" width="162" height="10" rx="3" fill="#eef2f6"/><text x="799.5" y="182" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">~85%</text><rect x="586" y="202" width="34" height="34" rx="6" fill="#c8b48a" stroke="#444"/><text x="630" y="216" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">Dry sand</text><rect x="630" y="224" width="76" height="10" rx="3" fill="#c8b48a"/><text x="714.0" y="234" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">~40%</text><rect x="586" y="254" width="34" height="34" rx="6" fill="#5d7a3a" stroke="#444"/><text x="630" y="268" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">Grass</text><rect x="630" y="276" width="48" height="10" rx="3" fill="#5d7a3a"/><text x="685.5" y="286" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">~25%</text><rect x="586" y="306" width="34" height="34" rx="6" fill="#4a3324" stroke="#444"/><text x="630" y="320" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">Dark wood</text><rect x="630" y="328" width="23" height="10" rx="3" fill="#4a3324"/><text x="660.8" y="338" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">~12%</text><text x="586" y="364" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">Typical real-world albedo. Brighter, more</text><text x="586" y="382" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="normal">saturated surfaces bounce more colour.</text></svg>