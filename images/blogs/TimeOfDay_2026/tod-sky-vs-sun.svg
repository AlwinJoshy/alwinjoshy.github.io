<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Sky ambient versus sun key light across the day</title><desc id="d">Left: the sky drawn as a dome sending soft blue light in from every direction, the sun as parallel yellow rays from one side; the cabin shadow is lit only by the sky so it turns blue. Right: illustrative bars of key light against sky ambient. Dawn is mostly sky, noon is mostly sun, dusk is a warm key with sky fill, and at night both are low so support lights carry the image.</desc><rect width="960" height="430" rx="14" fill="#111"/><text x="30" y="44" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">The sky is a giant soft light, the sun is one hard key</text><rect x="30" y="70" width="460" height="330" rx="10" fill="#181818" stroke="#2a2a2a"/><path d="M76.0,330 A184.0,156.4 0 0 1 444.0,330" fill="#7ad6ff" fill-opacity=".08" stroke="#7ad6ff" stroke-opacity=".7" stroke-width="2"/><line x1="435" y1="282" x2="386" y2="295" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="409" y1="238" x2="367" y2="264" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="368" y1="203" x2="338" y2="239" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="317" y1="181" x2="301" y2="223" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="260" y1="174" x2="260" y2="217" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="203" y1="181" x2="219" y2="223" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="152" y1="203" x2="182" y2="239" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="111" y1="238" x2="153" y2="264" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="85" y1="282" x2="134" y2="295" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7ad6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ffd27a"/></marker></defs><line x1="46" y1="330" x2="474" y2="330" stroke="#666" stroke-width="2"/><rect x="210.0" y="286" width="60" height="44" fill="#6b4a33"/><path d="M202.0,286 L240.0,256 L278.0,286z" fill="#8a8f99"/><line x1="328" y1="145" x2="252" y2="268" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#ay)"/><line x1="371" y1="149" x2="274" y2="306" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#ay)"/><line x1="418" y1="153" x2="310" y2="327" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#ay)"/><line x1="455" y1="157" x2="350" y2="327" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#ay)"/><circle cx="390" cy="120" r="14" fill="#ffd27a"/><path d="M210.0,329 L130.0,329 L130.0,335 L210.0,335z" fill="#4a6fa8"/><text x="46" y="360" font-size="13" fill="#9cc7ff" text-anchor="start" font-weight="normal">Shadow: only the sky reaches it,</text><text x="46" y="375" font-size="13" fill="#9cc7ff" text-anchor="start" font-weight="normal">so it turns blue</text><text x="46" y="100" font-size="14" fill="#9cc7ff" text-anchor="start" font-weight="normal">Sky: light from every direction</text><text x="46" y="119" font-size="14" fill="#ffd27a" text-anchor="start" font-weight="normal">Sun: one direction, sharp shadows</text><rect x="510" y="70" width="420" height="330" rx="10" fill="#181818" stroke="#2a2a2a"/><text x="526" y="104" font-size="16" fill="#e6e6e6" text-anchor="start" font-weight="bold">Key (sun / moon) vs sky ambient</text><text x="526" y="140" font-size="15" fill="#38de2c" text-anchor="start" font-weight="bold">Dawn</text><rect x="590" y="126" width="63" height="12" rx="3" fill="#ffd27a"/><rect x="590" y="142" width="237" height="12" rx="3" fill="#7ad6ff"/><text x="590" y="172" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="normal">sky does most of the work</text><text x="526" y="202" font-size="15" fill="#38de2c" text-anchor="start" font-weight="bold">Noon</text><rect x="590" y="188" width="284" height="12" rx="3" fill="#ffd27a"/><rect x="590" y="204" width="111" height="12" rx="3" fill="#7ad6ff"/><text x="590" y="234" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="normal">sun dominates, sky fills shade</text><text x="526" y="264" font-size="15" fill="#38de2c" text-anchor="start" font-weight="bold">Dusk</text><rect x="590" y="250" width="190" height="12" rx="3" fill="#ffd27a"/><rect x="590" y="266" width="126" height="12" rx="3" fill="#7ad6ff"/><text x="590" y="296" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="normal">warm key, sky still fills</text><text x="526" y="326" font-size="15" fill="#38de2c" text-anchor="start" font-weight="bold">Night</text><rect x="590" y="312" width="38" height="12" rx="3" fill="#ffd27a"/><rect x="590" y="328" width="25" height="12" rx="3" fill="#7ad6ff"/><text x="590" y="358" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="normal">support lights carry the image</text><rect x="526" y="371" width="12" height="12" fill="#ffd27a"/><text x="544" y="382" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="normal">key</text><rect x="586" y="371" width="12" height="12" fill="#7ad6ff"/><text x="604" y="382" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="normal">sky ambient</text><text x="914" y="382" font-size="12" fill="#888" text-anchor="end" font-weight="normal">illustrative, not measured</text></svg>