<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 790" width="600" height="790" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Reflections follow the sky through the day</title><desc id="d">Left: a camera looks at a pond at a low angle and the reflected ray goes up to the sky, so the water shows the sky. Right: the Fresnel curve for water, about 2 percent reflection looking straight down rising to 100 percent at grazing angles, and four swatches of the sky colour sampled from the dawn, noon, dusk and night renders.</desc><rect width="600" height="790" rx="14" fill="#111"/><text x="30" y="44" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">Water and gloss reflect the sky,</text><text x="30" y="78" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">so they change with it</text><defs><marker id="m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ccc"/></marker></defs><rect x="30" y="110" width="540" height="300" rx="10" fill="#181818" stroke="#2a2a2a"/><rect x="31" y="340" width="538" height="69" fill="#1e3a44"/><text x="46" y="390" font-size="19" fill="#8fc3d1" text-anchor="start" font-weight="normal">pond surface</text><circle cx="80" cy="260" r="10" fill="none" stroke="#ccc" stroke-width="2"/><circle cx="83" cy="260" r="4" fill="#ccc"/><text x="74" y="242" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">camera</text><line x1="92" y1="266" x2="300.0" y2="340" stroke="#ccc" stroke-width="2" marker-end="url(#m3)"/><line x1="300.0" y1="340" x2="509" y2="250" stroke="#ccc" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m3)"/><text x="501.0" y="238" font-size="19" fill="#a8a8a8" text-anchor="end" font-weight="normal">sees the sky</text><text x="46" y="142" font-size="20" fill="#e6e6e6" text-anchor="start" font-weight="normal">At a low angle, water is mostly a mirror</text><rect x="30" y="430" width="540" height="340" rx="10" fill="#181818" stroke="#2a2a2a"/><text x="46" y="462" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">Fresnel: reflection vs angle</text><line x1="100" y1="640" x2="540" y2="640" stroke="#666"/><line x1="100" y1="640" x2="100" y2="500" stroke="#666"/><polyline points="100.0,637.2 104.9,637.2 109.8,637.2 114.7,637.2 119.6,637.2 124.4,637.2 129.3,637.2 134.2,637.2 139.1,637.2 144.0,637.2 148.9,637.2 153.8,637.2 158.7,637.2 163.6,637.2 168.4,637.2 173.3,637.2 178.2,637.2 183.1,637.2 188.0,637.2 192.9,637.2 197.8,637.2 202.7,637.2 207.6,637.2 212.4,637.1 217.3,637.1 222.2,637.1 227.1,637.1 232.0,637.1 236.9,637.1 241.8,637.1 246.7,637.0 251.6,637.0 256.4,637.0 261.3,637.0 266.2,636.9 271.1,636.9 276.0,636.8 280.9,636.8 285.8,636.7 290.7,636.7 295.6,636.6 300.4,636.5 305.3,636.5 310.2,636.4 315.1,636.3 320.0,636.1 324.9,636.0 329.8,635.9 334.7,635.7 339.6,635.5 344.4,635.3 349.3,635.1 354.2,634.9 359.1,634.6 364.0,634.3 368.9,634.0 373.8,633.6 378.7,633.2 383.6,632.8 388.4,632.3 393.3,631.7 398.2,631.1 403.1,630.4 408.0,629.7 412.9,628.8 417.8,627.9 422.7,626.9 427.6,625.7 432.4,624.4 437.3,623.0 442.2,621.4 447.1,619.7 452.0,617.7 456.9,615.5 461.8,613.1 466.7,610.4 471.6,607.4 476.4,604.0 481.3,600.3 486.2,596.1 491.1,591.4 496.0,586.2 500.9,580.4 505.8,573.9 510.7,566.6 515.6,558.4 520.4,549.3 525.3,539.0 530.2,527.5 535.1,514.6 540.0,500.0" fill="none" stroke="#38de2c" stroke-width="3"/><text x="100" y="660" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">looking down</text><text x="540" y="660" font-size="18" fill="#a8a8a8" text-anchor="end" font-weight="normal">grazing</text><text x="92" y="504" font-size="18" fill="#a8a8a8" text-anchor="end" font-weight="normal">100%</text><text x="92" y="640" font-size="18" fill="#a8a8a8" text-anchor="end" font-weight="normal">~2%</text><text x="46" y="696" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">Sky colour sampled from each render:</text><rect x="46" y="706" width="117" height="22" rx="4" fill="#2f4a7a" stroke="#444"/><text x="46.0" y="749" font-size="18" fill="#e6e6e6" text-anchor="start" font-weight="normal">Dawn</text><rect x="173" y="706" width="117" height="22" rx="4" fill="#527cc6" stroke="#444"/><text x="173.0" y="749" font-size="18" fill="#e6e6e6" text-anchor="start" font-weight="normal">Noon</text><rect x="300" y="706" width="117" height="22" rx="4" fill="#ab7b60" stroke="#444"/><text x="300.0" y="749" font-size="18" fill="#e6e6e6" text-anchor="start" font-weight="normal">Dusk</text><rect x="427" y="706" width="117" height="22" rx="4" fill="#16171d" stroke="#444"/><text x="427.0" y="749" font-size="18" fill="#e6e6e6" text-anchor="start" font-weight="normal">Night</text></svg>