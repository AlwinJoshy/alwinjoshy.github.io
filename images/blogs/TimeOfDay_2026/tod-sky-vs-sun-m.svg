<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1008" width="600" height="1008" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Sky ambient versus sun key light across the day</title><desc id="d">Left: the sky drawn as a dome sending soft blue light in from every direction, the sun as parallel yellow rays from one side; the cabin shadow is lit only by the sky so it turns blue. Right: illustrative bars of key light against sky ambient. Dawn is mostly sky, noon is mostly sun, dusk is a warm key with sky fill, and at night both are low so support lights carry the image.</desc><rect width="600" height="1008" rx="14" fill="#111"/><text x="30" y="44" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">The sky is a giant soft light,</text><text x="30" y="78" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">the sun is one hard key</text><rect x="30" y="110" width="540" height="380" rx="10" fill="#181818" stroke="#2a2a2a"/><path d="M84.0,420 A216.0,183.6 0 0 1 516.0,420" fill="#7ad6ff" fill-opacity=".08" stroke="#7ad6ff" stroke-opacity=".7" stroke-width="2"/><line x1="505" y1="363" x2="448" y2="379" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="475" y1="312" x2="426" y2="342" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="427" y1="271" x2="391" y2="313" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="367" y1="245" x2="348" y2="294" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="300" y1="236" x2="300" y2="288" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="233" y1="245" x2="252" y2="294" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="173" y1="271" x2="209" y2="313" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="125" y1="312" x2="174" y2="342" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><line x1="95" y1="363" x2="152" y2="379" stroke="#7ad6ff" stroke-width="2" marker-end="url(#ab)"/><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7ad6ff"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ffd27a"/></marker></defs><line x1="46" y1="420" x2="554" y2="420" stroke="#666" stroke-width="2"/><rect x="250.0" y="376" width="60" height="44" fill="#6b4a33"/><path d="M242.0,376 L280.0,346 L318.0,376z" fill="#8a8f99"/><line x1="390" y1="200" x2="292" y2="358" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#ay)"/><line x1="433" y1="204" x2="314" y2="396" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#ay)"/><line x1="480" y1="208" x2="350" y2="417" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#ay)"/><line x1="517" y1="212" x2="390" y2="417" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#ay)"/><circle cx="430" cy="174" r="14" fill="#ffd27a"/><path d="M250.0,419 L170.0,419 L170.0,425 L250.0,425z" fill="#4a6fa8"/><text x="46" y="450" font-size="19" fill="#9cc7ff" text-anchor="start" font-weight="normal">Shadow: only the sky reaches it,</text><text x="46" y="471" font-size="19" fill="#9cc7ff" text-anchor="start" font-weight="normal">so it turns blue</text><text x="46" y="140" font-size="20" fill="#9cc7ff" text-anchor="start" font-weight="normal">Sky: light from every direction</text><text x="46" y="165" font-size="20" fill="#ffd27a" text-anchor="start" font-weight="normal">Sun: one direction, sharp shadows</text><rect x="30" y="514" width="540" height="470" rx="10" fill="#181818" stroke="#2a2a2a"/><text x="46" y="548" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">Key (sun / moon) vs sky ambient</text><text x="46" y="598" font-size="21" fill="#38de2c" text-anchor="start" font-weight="bold">Dawn</text><rect x="120" y="584" width="85" height="12" rx="3" fill="#ffd27a"/><rect x="120" y="600" width="320" height="12" rx="3" fill="#7ad6ff"/><text x="120" y="636" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">sky does most of the work</text><text x="46" y="690" font-size="21" fill="#38de2c" text-anchor="start" font-weight="bold">Noon</text><rect x="120" y="676" width="383" height="12" rx="3" fill="#ffd27a"/><rect x="120" y="692" width="149" height="12" rx="3" fill="#7ad6ff"/><text x="120" y="728" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">sun dominates, sky fills shade</text><text x="46" y="782" font-size="21" fill="#38de2c" text-anchor="start" font-weight="bold">Dusk</text><rect x="120" y="768" width="256" height="12" rx="3" fill="#ffd27a"/><rect x="120" y="784" width="170" height="12" rx="3" fill="#7ad6ff"/><text x="120" y="820" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">warm key, sky still fills</text><text x="46" y="874" font-size="21" fill="#38de2c" text-anchor="start" font-weight="bold">Night</text><rect x="120" y="860" width="51" height="12" rx="3" fill="#ffd27a"/><rect x="120" y="876" width="34" height="12" rx="3" fill="#7ad6ff"/><text x="120" y="912" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">support lights carry the image</text><rect x="46" y="955" width="12" height="12" fill="#ffd27a"/><text x="64" y="966" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">key</text><rect x="126" y="955" width="12" height="12" fill="#7ad6ff"/><text x="144" y="966" font-size="19" fill="#a8a8a8" text-anchor="start" font-weight="normal">sky ambient</text><text x="554" y="966" font-size="18" fill="#888" text-anchor="end" font-weight="normal">illustrative, not measured</text></svg>