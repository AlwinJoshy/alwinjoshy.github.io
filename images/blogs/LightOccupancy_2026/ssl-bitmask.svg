<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">One cell, one byte: the light mask</title><desc id="d">The mask 00100101 equals 37: bits 0, 2 and 5 are set, so the shader shades lights 0, 2 and 5 and skips the other five.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="960" height="460" rx="14" fill="#111"/><text x="30.0" y="44.0" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">One cell, one byte: the light mask</text><text x="30.0" y="78.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">mask = 00100101 (binary) = 37   →   lights 0, 2 and 5 touch this cell</text><text x="72.0" y="120.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 7</text><rect x="40.0" y="130.0" width="64.0" height="64.0" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2"/><text x="72.0" y="172.8" font-size="30" fill="#6a6a6a" text-anchor="middle" font-weight="bold">0</text><circle cx="72.0" cy="216.0" r="8.0" fill="#333"/><text x="72.0" y="246.0" font-size="15" fill="#6a6a6a" text-anchor="middle" font-weight="normal">L7</text><text x="146.0" y="120.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 6</text><rect x="114.0" y="130.0" width="64.0" height="64.0" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2"/><text x="146.0" y="172.8" font-size="30" fill="#6a6a6a" text-anchor="middle" font-weight="bold">0</text><circle cx="146.0" cy="216.0" r="8.0" fill="#333"/><text x="146.0" y="246.0" font-size="15" fill="#6a6a6a" text-anchor="middle" font-weight="normal">L6</text><text x="220.0" y="120.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 5</text><rect x="188.0" y="130.0" width="64.0" height="64.0" rx="8" fill="#1f3a1c" stroke="#38de2c" stroke-width="2"/><text x="220.0" y="172.8" font-size="30" fill="#38de2c" text-anchor="middle" font-weight="bold">1</text><circle cx="220.0" cy="216.0" r="8.0" fill="#5a8cff"/><text x="220.0" y="246.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="normal">L5</text><text x="294.0" y="120.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 4</text><rect x="262.0" y="130.0" width="64.0" height="64.0" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2"/><text x="294.0" y="172.8" font-size="30" fill="#6a6a6a" text-anchor="middle" font-weight="bold">0</text><circle cx="294.0" cy="216.0" r="8.0" fill="#333"/><text x="294.0" y="246.0" font-size="15" fill="#6a6a6a" text-anchor="middle" font-weight="normal">L4</text><text x="368.0" y="120.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 3</text><rect x="336.0" y="130.0" width="64.0" height="64.0" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2"/><text x="368.0" y="172.8" font-size="30" fill="#6a6a6a" text-anchor="middle" font-weight="bold">0</text><circle cx="368.0" cy="216.0" r="8.0" fill="#333"/><text x="368.0" y="246.0" font-size="15" fill="#6a6a6a" text-anchor="middle" font-weight="normal">L3</text><text x="442.0" y="120.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 2</text><rect x="410.0" y="130.0" width="64.0" height="64.0" rx="8" fill="#1f3a1c" stroke="#38de2c" stroke-width="2"/><text x="442.0" y="172.8" font-size="30" fill="#38de2c" text-anchor="middle" font-weight="bold">1</text><circle cx="442.0" cy="216.0" r="8.0" fill="#ffd24a"/><text x="442.0" y="246.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="normal">L2</text><text x="516.0" y="120.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 1</text><rect x="484.0" y="130.0" width="64.0" height="64.0" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2"/><text x="516.0" y="172.8" font-size="30" fill="#6a6a6a" text-anchor="middle" font-weight="bold">0</text><circle cx="516.0" cy="216.0" r="8.0" fill="#333"/><text x="516.0" y="246.0" font-size="15" fill="#6a6a6a" text-anchor="middle" font-weight="normal">L1</text><text x="590.0" y="120.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 0</text><rect x="558.0" y="130.0" width="64.0" height="64.0" rx="8" fill="#1f3a1c" stroke="#38de2c" stroke-width="2"/><text x="590.0" y="172.8" font-size="30" fill="#38de2c" text-anchor="middle" font-weight="bold">1</text><circle cx="590.0" cy="216.0" r="8.0" fill="#ff5c5c"/><text x="590.0" y="246.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="normal">L0</text><text x="660.0" y="160.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">Stored per cell in</text><text x="660.0" y="184.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">_MaskBuffer and read</text><text x="660.0" y="208.0" font-size="17" fill="#a8a8a8" text-anchor="start" font-weight="normal">once per pixel.</text><text x="30.0" y="292.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">How the shader walks it ([unroll] for b = 0..7):</text><rect x="30.0" y="308.0" width="102.0" height="62.0" rx="8" fill="#1f3a1c" stroke="#38de2c"/><text x="81.0" y="333.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">b = 0</text><text x="81.0" y="357.0" font-size="16" fill="#38de2c" text-anchor="middle" font-weight="bold">shade L0</text><rect x="142.0" y="308.0" width="102.0" height="62.0" rx="8" fill="#151515" stroke="#3a3a3a" stroke-dasharray="5 4"/><text x="193.0" y="333.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">b = 1</text><text x="193.0" y="357.0" font-size="16" fill="#7a7a7a" text-anchor="middle" font-weight="bold">skip</text><rect x="254.0" y="308.0" width="102.0" height="62.0" rx="8" fill="#1f3a1c" stroke="#38de2c"/><text x="305.0" y="333.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">b = 2</text><text x="305.0" y="357.0" font-size="16" fill="#38de2c" text-anchor="middle" font-weight="bold">shade L2</text><rect x="366.0" y="308.0" width="102.0" height="62.0" rx="8" fill="#151515" stroke="#3a3a3a" stroke-dasharray="5 4"/><text x="417.0" y="333.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">b = 3</text><text x="417.0" y="357.0" font-size="16" fill="#7a7a7a" text-anchor="middle" font-weight="bold">skip</text><rect x="478.0" y="308.0" width="102.0" height="62.0" rx="8" fill="#151515" stroke="#3a3a3a" stroke-dasharray="5 4"/><text x="529.0" y="333.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">b = 4</text><text x="529.0" y="357.0" font-size="16" fill="#7a7a7a" text-anchor="middle" font-weight="bold">skip</text><rect x="590.0" y="308.0" width="102.0" height="62.0" rx="8" fill="#1f3a1c" stroke="#38de2c"/><text x="641.0" y="333.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">b = 5</text><text x="641.0" y="357.0" font-size="16" fill="#38de2c" text-anchor="middle" font-weight="bold">shade L5</text><rect x="702.0" y="308.0" width="102.0" height="62.0" rx="8" fill="#151515" stroke="#3a3a3a" stroke-dasharray="5 4"/><text x="753.0" y="333.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">b = 6</text><text x="753.0" y="357.0" font-size="16" fill="#7a7a7a" text-anchor="middle" font-weight="bold">skip</text><rect x="814.0" y="308.0" width="102.0" height="62.0" rx="8" fill="#151515" stroke="#3a3a3a" stroke-dasharray="5 4"/><text x="865.0" y="333.0" font-size="15" fill="#a8a8a8" text-anchor="middle" font-weight="normal">b = 7</text><text x="865.0" y="357.0" font-size="16" fill="#7a7a7a" text-anchor="middle" font-weight="bold">skip</text><text x="30.0" y="404.0" font-size="16" fill="#e6e6e6" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">if ((mask &amp; (1 &lt;&lt; b)) == 0) continue;</text><text x="30.0" y="432.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">3 of 8 light slots evaluated here. If the mask is 0, the whole loop is skipped.</text></svg>