<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1146" width="600" height="1146" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Two halves: a slow CPU scan and a fast per-pixel lookup</title><desc id="d">The CPU gathers lights, projects them, tests each cell and uploads masks every scan interval; the GPU finds each pixel's cell, reads its mask and shades only the flagged lights every frame.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="600" height="1146" rx="14" fill="#111"/><text x="30.0" y="48.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">Two halves: a slow CPU scan</text><text x="30.0" y="82.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">and a fast per-pixel lookup</text><text x="30.0" y="110.0" font-size="20" fill="#38de2c" text-anchor="start" font-weight="bold">CPU · every Scan Interval (0.1 s)</text><rect x="30.0" y="126.0" width="540.0" height="92.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="44.0" y="154.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">Gather lights</text><text x="44.0" y="184.4" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">point + spot lights, first Max Lights (8)</text><text x="44.0" y="208.8" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">→ _LightBuffer</text><line x1="300.0" y1="220.0" x2="300.0" y2="238.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="30.0" y="242.0" width="540.0" height="92.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="44.0" y="270.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">Project to screen</text><text x="44.0" y="300.4" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">WorldToScreenPoint, range → pixel radius</text><text x="44.0" y="324.8" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">(uses FOV and depth)</text><line x1="300.0" y1="336.0" x2="300.0" y2="354.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="30.0" y="358.0" width="540.0" height="92.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="44.0" y="386.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">Test every cell</text><text x="44.0" y="416.4" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">circle vs cell rectangle, + rough spot cone test</text><text x="44.0" y="440.8" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">hit → mask |= 1 &lt;&lt; i</text><line x1="300.0" y1="452.0" x2="300.0" y2="470.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="30.0" y="474.0" width="540.0" height="92.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="44.0" y="502.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">Upload</text><text x="44.0" y="532.5" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">_MaskBuffer (W × H)</text><text x="44.0" y="556.8" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">grid size, light count,, occupancy bias</text><line x1="300.0" y1="568.0" x2="300.0" y2="586.0" stroke="#38de2c" stroke-width="2" marker-end="url(#ahg)"/><text x="30.0" y="606.0" font-size="20" fill="#38de2c" text-anchor="start" font-weight="bold">GPU · every pixel, every frame</text><rect x="30.0" y="622.0" width="540.0" height="92.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="44.0" y="650.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">Find my cell</text><text x="44.0" y="680.5" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">screen UV × grid size</text><text x="44.0" y="704.8" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">→ (cx, cy)</text><line x1="300.0" y1="716.0" x2="300.0" y2="734.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="30.0" y="738.0" width="540.0" height="92.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="44.0" y="766.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">Read the mask</text><text x="44.0" y="796.5" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">_MaskBuffer[cy·W + cx]</text><text x="44.0" y="820.8" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">one read per pixel</text><line x1="300.0" y1="832.0" x2="300.0" y2="850.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="30.0" y="854.0" width="540.0" height="92.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="44.0" y="882.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">Walk the set bits</text><text x="44.0" y="912.5" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">attenuation + spot cone</text><text x="44.0" y="936.8" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">NdotL, Blinn-Phong spec</text><line x1="300.0" y1="948.0" x2="300.0" y2="966.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="30.0" y="970.0" width="540.0" height="92.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="44.0" y="998.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">Final colour</text><text x="44.0" y="1028.5" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">albedo × (ambient + dir</text><text x="44.0" y="1052.8" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">+ masked lights + rim) + specular</text><text x="30.0" y="1096.0" font-size="18" fill="#ff7a5a" text-anchor="start" font-weight="normal">If the mask is 0, the shader skips straight to</text><text x="30.0" y="1120.3" font-size="18" fill="#ff7a5a" text-anchor="start" font-weight="normal">ambient + directional + rim.</text></svg>