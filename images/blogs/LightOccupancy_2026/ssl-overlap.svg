al">When every bit is set, those pixels evaluate all 8 lights, the same as the naive loop, plus the mask read.</text><text x="30.0" y="410.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">My demo room is close to that: the lights are big compared to the room, so most cells show 3–5.</text></svg>