<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 870" width="600" height="870" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">One cell, one byte: the light mask</title><desc id="d">The mask 00100101 equals 37: bits 0, 2 and 5 are set, so the shader shades lights 0, 2 and 5 and skips the other five.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="600" height="870" rx="14" fill="#111"/><text x="30.0" y="48.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">One cell, one byte: the light mask</text><text x="30.0" y="88.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">mask = 00100101 (binary) = 37</text><text x="30.0" y="116.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">→ lights 0, 2 and 5 touch this cell</text><text x="59.0" y="170.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 7</text><rect x="30.0" y="180.0" width="58.0" height="58.0" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2"/><text x="59.0" y="219.1" font-size="28" fill="#6a6a6a" text-anchor="middle" font-weight="bold">0</text><circle cx="59.0" cy="260.0" r="8.0" fill="#333"/><text x="59.0" y="290.0" font-size="18" fill="#6a6a6a" text-anchor="middle" font-weight="normal">L7</text><text x="127.0" y="170.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 6</text><rect x="98.0" y="180.0" width="58.0" height="58.0" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2"/><text x="127.0" y="219.1" font-size="28" fill="#6a6a6a" text-anchor="middle" font-weight="bold">0</text><circle cx="127.0" cy="260.0" r="8.0" fill="#333"/><text x="127.0" y="290.0" font-size="18" fill="#6a6a6a" text-anchor="middle" font-weight="normal">L6</text><text x="195.0" y="170.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 5</text><rect x="166.0" y="180.0" width="58.0" height="58.0" rx="8" fill="#1f3a1c" stroke="#38de2c" stroke-width="2"/><text x="195.0" y="219.1" font-size="28" fill="#38de2c" text-anchor="middle" font-weight="bold">1</text><circle cx="195.0" cy="260.0" r="8.0" fill="#5a8cff"/><text x="195.0" y="290.0" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="normal">L5</text><text x="263.0" y="170.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 4</text><rect x="234.0" y="180.0" width="58.0" height="58.0" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2"/><text x="263.0" y="219.1" font-size="28" fill="#6a6a6a" text-anchor="middle" font-weight="bold">0</text><circle cx="263.0" cy="260.0" r="8.0" fill="#333"/><text x="263.0" y="290.0" font-size="18" fill="#6a6a6a" text-anchor="middle" font-weight="normal">L4</text><text x="331.0" y="170.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 3</text><rect x="302.0" y="180.0" width="58.0" height="58.0" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2"/><text x="331.0" y="219.1" font-size="28" fill="#6a6a6a" text-anchor="middle" font-weight="bold">0</text><circle cx="331.0" cy="260.0" r="8.0" fill="#333"/><text x="331.0" y="290.0" font-size="18" fill="#6a6a6a" text-anchor="middle" font-weight="normal">L3</text><text x="399.0" y="170.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 2</text><rect x="370.0" y="180.0" width="58.0" height="58.0" rx="8" fill="#1f3a1c" stroke="#38de2c" stroke-width="2"/><text x="399.0" y="219.1" font-size="28" fill="#38de2c" text-anchor="middle" font-weight="bold">1</text><circle cx="399.0" cy="260.0" r="8.0" fill="#ffd24a"/><text x="399.0" y="290.0" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="normal">L2</text><text x="467.0" y="170.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 1</text><rect x="438.0" y="180.0" width="58.0" height="58.0" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="2"/><text x="467.0" y="219.1" font-size="28" fill="#6a6a6a" text-anchor="middle" font-weight="bold">0</text><circle cx="467.0" cy="260.0" r="8.0" fill="#333"/><text x="467.0" y="290.0" font-size="18" fill="#6a6a6a" text-anchor="middle" font-weight="normal">L1</text><text x="535.0" y="170.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">bit 0</text><rect x="506.0" y="180.0" width="58.0" height="58.0" rx="8" fill="#1f3a1c" stroke="#38de2c" stroke-width="2"/><text x="535.0" y="219.1" font-size="28" fill="#38de2c" text-anchor="middle" font-weight="bold">1</text><circle cx="535.0" cy="260.0" r="8.0" fill="#ff5c5c"/><text x="535.0" y="290.0" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="normal">L0</text><text x="30.0" y="350.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">How the shader walks it:</text><rect x="30.0" y="372.0" width="540.0" height="42.0" rx="8" fill="#1f3a1c" stroke="#38de2c"/><text x="48.0" y="400.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">b = 0</text><text x="170.0" y="400.0" font-size="20" fill="#38de2c" text-anchor="start" font-weight="bold">bit set → shade light 0</text><rect x="30.0" y="422.0" width="540.0" height="42.0" rx="8" fill="#151515" stroke="#3a3a3a" stroke-dasharray="5 4"/><text x="48.0" y="450.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">b = 1</text><text x="170.0" y="450.0" font-size="20" fill="#7a7a7a" text-anchor="start" font-weight="normal">bit clear → skip</text><rect x="30.0" y="472.0" width="540.0" height="42.0" rx="8" fill="#1f3a1c" stroke="#38de2c"/><text x="48.0" y="500.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">b = 2</text><text x="170.0" y="500.0" font-size="20" fill="#38de2c" text-anchor="start" font-weight="bold">bit set → shade light 2</text><rect x="30.0" y="522.0" width="540.0" height="42.0" rx="8" fill="#151515" stroke="#3a3a3a" stroke-dasharray="5 4"/><text x="48.0" y="550.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">b = 3</text><text x="170.0" y="550.0" font-size="20" fill="#7a7a7a" text-anchor="start" font-weight="normal">bit clear → skip</text><rect x="30.0" y="572.0" width="540.0" height="42.0" rx="8" fill="#151515" stroke="#3a3a3a" stroke-dasharray="5 4"/><text x="48.0" y="600.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">b = 4</text><text x="170.0" y="600.0" font-size="20" fill="#7a7a7a" text-anchor="start" font-weight="normal">bit clear → skip</text><rect x="30.0" y="622.0" width="540.0" height="42.0" rx="8" fill="#1f3a1c" stroke="#38de2c"/><text x="48.0" y="650.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">b = 5</text><text x="170.0" y="650.0" font-size="20" fill="#38de2c" text-anchor="start" font-weight="bold">bit set → shade light 5</text><rect x="30.0" y="672.0" width="540.0" height="42.0" rx="8" fill="#151515" stroke="#3a3a3a" stroke-dasharray="5 4"/><text x="48.0" y="700.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">b = 6</text><text x="170.0" y="700.0" font-size="20" fill="#7a7a7a" text-anchor="start" font-weight="normal">bit clear → skip</text><rect x="30.0" y="722.0" width="540.0" height="42.0" rx="8" fill="#151515" stroke="#3a3a3a" stroke-dasharray="5 4"/><text x="48.0" y="750.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">b = 7</text><text x="170.0" y="750.0" font-size="20" fill="#7a7a7a" text-anchor="start" font-weight="normal">bit clear → skip</text><text x="30.0" y="800.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">if ((mask &amp; (1 &lt;&lt; b)) == 0) continue;</text><text x="30.0" y="840.0" font-size="20" fill="#a8a8a8" text-anchor="start" font-weight="normal">3 of 8 slots evaluated. Mask 0 = loop skipped.</text></svg>