<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Toon Steps: quantising N·L into bands</title><desc id="d">A graph of smooth diffuse versus floor of N dot L times steps divided by steps with three steps, and two spheres showing smooth versus banded shading.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="600" height="900" rx="14" fill="#111"/><text x="30.0" y="48.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">Toon Steps: quantising</text><text x="30.0" y="82.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">N·L into bands</text><rect x="20.0" y="90.0" width="560.0" height="640.0" rx="10" fill="#0d1210" stroke="#2a2a2a"/><g transform="translate(110.0,150.0) scale(1.2500)"><line x1="0.0" y1="220.0" x2="330.0" y2="220.0" stroke="#a8a8a8" stroke-width="1.5" marker-end="url(#ah)"/><line x1="0.0" y1="220.0" x2="0.0" y2="-10.0" stroke="#a8a8a8" stroke-width="1.5" marker-end="url(#ah)"/><text x="320.0" y="248.0" font-size="18" fill="#a8a8a8" text-anchor="end" font-weight="normal">N·L</text><text x="-10.0" y="0.0" font-size="18" fill="#a8a8a8" text-anchor="end" font-weight="normal">diffuse</text><line x1="0.0" y1="220.0" x2="320.0" y2="0.0" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="6 5"/><path d="M 0 220 L 106.66666666666667 220.0 L 106.66666666666667 146.66666666666669 L 213.33333333333334 146.66666666666669 L 213.33333333333334 73.33333333333334 L 320.0 73.33333333333334 L 320 0" fill="none" stroke="#38de2c" stroke-width="3"/><text x="160.0" y="30.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">smooth</text><text x="217.6" y="176.7" font-size="18" fill="#38de2c" text-anchor="start" font-weight="normal">steps = 3</text></g><g transform="translate(70.0,490.0) scale(1.1800)"><defs><radialGradient id="sg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#f0d090"/><stop offset="1" stop-color="#2a2010"/></radialGradient><clipPath id="sc"><circle cx="230" cy="70" r="70"/></clipPath></defs><circle cx="70.0" cy="70.0" r="70.0" fill="url(#sg)"/><text x="70.0" y="170.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">Toon Steps 0</text><g clip-path="url(#sc)"><circle cx="230.0" cy="70.0" r="70.0" fill="#2a2010"/><circle cx="210.0" cy="52.0" r="60.0" fill="#7a6030"/><circle cx="190.0" cy="34.0" r="50.0" fill="#c09a55"/><circle cx="170.0" cy="16.0" r="40.0" fill="#f0d090"/></g><text x="230.0" y="170.0" font-size="18" fill="#38de2c" text-anchor="middle" font-weight="normal">Toon Steps 3</text></g><text x="30.0" y="780.0" font-size="17" fill="#38de2c" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">floor(ndotl × steps) / steps</text><text x="30.0" y="820.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">Diffuse only (directional + masked lights);</text><text x="30.0" y="844.3" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">specular stays smooth. 0 = off. In the demo</text><text x="30.0" y="868.6" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">material it is set to 0.</text></svg>