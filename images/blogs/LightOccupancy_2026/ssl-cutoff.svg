<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Why highlights get cut at cell borders</title><desc id="d">Side view: the scanner sizes each light's circle at the light's own depth, but a surface point S nearer the camera and still in range projects outside that circle. On the grid, orange cells are lit by the light but do not have its bit, so the light stops at a cell edge.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="960" height="680" rx="14" fill="#111"/><text x="30.0" y="44.0" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">Why highlights get cut at cell borders</text><rect x="20.0" y="62.0" width="500.0" height="470.0" rx="10" fill="#0d1210" stroke="#2a2a2a"/><g transform="translate(30.0,72.0) scale(1.0000)"><defs><clipPath id="cpc"><rect x="0" y="0" width="470" height="400"/></clipPath></defs><g clip-path="url(#cpc)"><circle cx="200.0" cy="240.0" r="140.0" fill="#7dffb0" fill-opacity=".08"/><circle cx="200.0" cy="240.0" r="140.0" fill="none" stroke="#7dffb0" stroke-dasharray="6 4" stroke-width="2"/><path d="M 20 240 L 600 -211.11111111111114 M 20 240 L 600 691.1111111111111" fill="none" stroke="#38de2c" stroke-width="2.5" stroke-dasharray="8 5"/><line x1="20.0" y1="240.0" x2="600.0" y2="-376.2" stroke="#ff7a5a" stroke-width="2"/></g><circle cx="200.0" cy="240.0" r="7.0" fill="#7dffb0"/><text x="212.0" y="246.0" font-size="16" fill="#7dffb0" text-anchor="start" font-weight="normal">light</text><line x1="200.0" y1="240.0" x2="299.0" y2="339.0" stroke="#7dffb0" stroke-width="1.5"/><text x="259.0" y="315.0" font-size="16" fill="#7dffb0" text-anchor="start" font-weight="normal">range</text><circle cx="100.0" cy="155.0" r="8.0" fill="#ff7a5a"/><text x="88.0" y="145.0" font-size="18" fill="#ff7a5a" text-anchor="end" font-weight="bold">S</text><circle cx="20.0" cy="240.0" r="10.0" fill="#e6e6e6"/><text x="20.0" y="220.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">camera</text><line x1="60.0" y1="386.0" x2="60.0" y2="404.0" stroke="#7a7a7a" stroke-width="1.5"/><text x="60.0" y="424.0" font-size="16" fill="#a8a8a8" text-anchor="middle" font-weight="normal">z − range</text><line x1="200.0" y1="386.0" x2="200.0" y2="404.0" stroke="#7a7a7a" stroke-width="1.5"/><text x="200.0" y="424.0" font-size="16" fill="#a8a8a8" text-anchor="middle" font-weight="normal">z</text><line x1="320.0" y1="40.0" x2="360.0" y2="40.0" stroke="#38de2c" stroke-width="2.5" stroke-dasharray="8 5"/><text x="368.0" y="46.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="normal">tested</text><line x1="320.0" y1="72.0" x2="360.0" y2="72.0" stroke="#ff7a5a" stroke-width="2"/><text x="368.0" y="78.0" font-size="16" fill="#ff7a5a" text-anchor="start" font-weight="normal">ray to S</text></g><text x="30.0" y="556.0" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">S is in range but nearer the camera, so on screen it lands outside the tested circle.</text><text x="550.0" y="92.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">On the grid</text><g transform="translate(550.0,108.0) scale(1.0000)"><rect x="60" y="0" width="60" height="52" fill="#ff7a5a" fill-opacity="0.3"/><rect x="120" y="0" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="180" y="0" width="60" height="52" fill="#ff7a5a" fill-opacity="0.3"/><rect x="0" y="52" width="60" height="52" fill="#ff7a5a" fill-opacity="0.3"/><rect x="60" y="52" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="120" y="52" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="180" y="52" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="240" y="52" width="60" height="52" fill="#ff7a5a" fill-opacity="0.3"/><rect x="0" y="104" width="60" height="52" fill="#ff7a5a" fill-opacity="0.3"/><rect x="60" y="104" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="120" y="104" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="180" y="104" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="240" y="104" width="60" height="52" fill="#ff7a5a" fill-opacity="0.3"/><rect x="0" y="156" width="60" height="52" fill="#ff7a5a" fill-opacity="0.3"/><rect x="60" y="156" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="120" y="156" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="180" y="156" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="240" y="156" width="60" height="52" fill="#ff7a5a" fill-opacity="0.3"/><rect x="60" y="208" width="60" height="52" fill="#ff7a5a" fill-opacity="0.3"/><rect x="120" y="208" width="60" height="52" fill="#38de2c" fill-opacity="0.22"/><rect x="180" y="208" width="60" height="52" fill="#ff7a5a" fill-opacity="0.3"/><circle cx="150.0" cy="130.0" r="118.0" fill="none" stroke="#ff7a5a" stroke-width="2.5"/><circle cx="150.0" cy="130.0" r="80.0" fill="none" stroke="#38de2c" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="0" y1="0" x2="0" y2="260" stroke="#38de2c" stroke-opacity=".5"/><line x1="60" y1="0" x2="60" y2="260" stroke="#38de2c" stroke-opacity=".5"/><line x1="120" y1="0" x2="120" y2="260" stroke="#38de2c" stroke-opacity=".5"/><line x1="180" y1="0" x2="180" y2="260" stroke="#38de2c" stroke-opacity=".5"/><line x1="240" y1="0" x2="240" y2="260" stroke="#38de2c" stroke-opacity=".5"/><line x1="300" y1="0" x2="300" y2="260" stroke="#38de2c" stroke-opacity=".5"/><line x1="360" y1="0" x2="360" y2="260" stroke="#38de2c" stroke-opacity=".5"/><line x1="0" y1="0" x2="360" y2="0" stroke="#38de2c" stroke-opacity=".5"/><line x1="0" y1="52" x2="360" y2="52" stroke="#38de2c" stroke-opacity=".5"/><line x1="0" y1="104" x2="360" y2="104" stroke="#38de2c" stroke-opacity=".5"/><line x1="0" y1="156" x2="360" y2="156" stroke="#38de2c" stroke-opacity=".5"/><line x1="0" y1="208" x2="360" y2="208" stroke="#38de2c" stroke-opacity=".5"/><line x1="0" y1="260" x2="360" y2="260" stroke="#38de2c" stroke-opacity=".5"/></g><rect x="550.0" y="390.0" width="16.0" height="16.0" rx="3" fill="#38de2c" fill-opacity=".5"/><text x="574.0" y="403.0" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">bit set: light evaluated</text><rect x="550.0" y="416.0" width="16.0" height="16.0" rx="3" fill="#ff7a5a" fill-opacity=".6"/><text x="574.0" y="429.0" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">surface lit, bit missing → hard cut</text><text x="30.0" y="600.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">Fixes I want to try:</text><text x="30.0" y="628.0" font-size="15" fill="#38de2c" text-anchor="start" font-weight="normal">• Size the circle at the nearest depth, z − range</text><text x="30.0" y="650.0" font-size="15" fill="#38de2c" text-anchor="start" font-weight="normal">• Pad the test by one cell</text><text x="500.0" y="628.0" font-size="15" fill="#38de2c" text-anchor="start" font-weight="normal">• Store per-cell min/max depth and test in 3D</text><text x="500.0" y="650.0" font-size="15" fill="#38de2c" text-anchor="start" font-weight="normal">• Make the falloff reach zero inside the tested circle</text></svg>