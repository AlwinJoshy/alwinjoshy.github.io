 font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">shader will evaluate there.</text><text x="580.0" y="242.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">Empty cell = ambient + directional only.</text><text x="580.0" y="267.0" font-size="16" fill="#e6e6e6" text-anchor="start" font-weight="normal"></text><text x="580.0" y="292.0" font-size="16" fill="#e6e6e6" text-anchor="start" font-weight="bold">White cell: mask 00000011</text><text x="580.0" y="317.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="bold">→ lights 0 and 1</text><circle cx="590.0" cy="370.0" r="7.0" fill="#ff5c5c"/><text x="604.0" y="376.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">light 0</text><circle cx="700.0" cy="370.0" r="7.0" fill="#4ad8ff"/><text x="714.0" y="376.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">light 1</text><circle cx="810.0" cy="370.0" r="7.0" fill="#ffd24a"/><text x="824.0" y="376.0" font-size="16" fill="#a8a8a8" text-anchor="start" font-weight="normal">light 2</text><text x="30.0" y="410.0" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">Illustrative 8 × 5 grid. The demo uses 15 × 10; the numbers match what the debug overlay prints.</text></svg>