<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Idea: shadows from last frame's depth (not implemented)</title><desc id="d">A side view of marching from a surface point toward a light in screen space, comparing against the previous frame's depth buffer; a sample behind the stored depth means the light is blocked.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="600" height="800" rx="14" fill="#111"/><text x="30.0" y="48.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">Idea: shadows from last</text><text x="30.0" y="82.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">frame's depth (not implemented)</text><rect x="20.0" y="90.0" width="560.0" height="350.0" rx="10" fill="#0d1210" stroke="#2a2a2a"/><g transform="translate(40.0,110.0) scale(1.1500)"><line x1="0.0" y1="260.0" x2="440.0" y2="260.0" stroke="#5a5a5a" stroke-width="3"/><text x="10.0" y="285.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">floor</text><rect x="200.0" y="150.0" width="70.0" height="110.0" rx="4" fill="#2a2a2a" stroke="#555"/><text x="235.0" y="210.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">box</text><circle cx="360.0" cy="40.0" r="9.0" fill="#ffd24a"/><text x="376.0" y="46.0" font-size="18" fill="#ffd24a" text-anchor="start" font-weight="normal">light</text><circle cx="110.0" cy="258.0" r="6.0" fill="#e6e6e6"/><text x="102.0" y="286.0" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="normal">P</text><line x1="110.0" y1="258.0" x2="360.0" y2="40.0" stroke="#666" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="137.8" cy="233.8" r="5.0" fill="#38de2c"/><circle cx="165.6" cy="209.6" r="5.0" fill="#38de2c"/><circle cx="193.3" cy="185.3" r="5.0" fill="#38de2c"/><circle cx="221.1" cy="161.1" r="5.0" fill="#ff7a5a"/><circle cx="248.9" cy="136.9" r="5.0" fill="#38de2c"/><circle cx="276.7" cy="112.7" r="5.0" fill="#38de2c"/><circle cx="304.4" cy="88.4" r="5.0" fill="#38de2c"/><circle cx="332.2" cy="64.2" r="5.0" fill="#38de2c"/><text x="290.0" y="130.0" font-size="18" fill="#ff7a5a" text-anchor="start" font-weight="normal">stored depth is</text><text x="290.0" y="153.4" font-size="18" fill="#ff7a5a" text-anchor="start" font-weight="normal">in front → shadow</text></g><text x="30.0" y="480.0" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="normal">1 · Keep last frame's depth.</text><text x="30.0" y="510.0" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="normal">2 · For pixel P and each light in its mask,</text><text x="30.0" y="540.0" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="normal">     project P → light into screen space.</text><text x="30.0" y="570.0" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="normal">3 · March along it, comparing the ray</text><text x="30.0" y="600.0" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="normal">     depth with the stored depth.</text><text x="30.0" y="630.0" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="normal">4 · Stored depth in front → blocked →</text><text x="30.0" y="660.0" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="normal">     drop or dim that light.</text><text x="30.0" y="710.0" font-size="18" fill="#ff7a5a" text-anchor="start" font-weight="normal">Costs extra depth reads per light per pixel,</text><text x="30.0" y="736.0" font-size="18" fill="#ff7a5a" text-anchor="start" font-weight="normal">only sees what was on screen, and lags one</text><text x="30.0" y="762.0" font-size="18" fill="#ff7a5a" text-anchor="start" font-weight="normal">frame behind fast motion.</text></svg>