<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 546" width="960" height="546" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Two halves: a slow CPU scan and a fast per-pixel lookup</title><desc id="d">The CPU gathers lights, projects them, tests each cell and uploads masks every scan interval; the GPU finds each pixel's cell, reads its mask and shades only the flagged lights every frame.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="960" height="546" rx="14" fill="#111"/><text x="30.0" y="44.0" font-size="22" fill="#e6e6e6" text-anchor="start" font-weight="bold">Two halves: a slow CPU scan and a fast per-pixel lookup</text><rect x="20.0" y="64.0" width="920.0" height="196.0" rx="10" fill="#0d1210" stroke="#2a2a2a"/><text x="36.0" y="92.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="bold">CPU · ScreenOcupancyScanner.cs · every Scan Interval (0.1 s in my scene)</text><rect x="36.0" y="108.0" width="200.0" height="132.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="50.0" y="136.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">Gather lights</text><text x="50.0" y="160.7" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">point + spot lights</text><text x="50.0" y="180.9" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">first Max Lights (8)</text><text x="50.0" y="201.2" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">→ _LightBuffer</text><line x1="238.0" y1="174.0" x2="262.0" y2="174.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="266.0" y="108.0" width="200.0" height="132.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="280.0" y="136.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">Project to screen</text><text x="280.0" y="160.7" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">WorldToScreenPoint</text><text x="280.0" y="180.9" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">range → pixel radius</text><text x="280.0" y="201.2" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">(uses FOV and depth)</text><line x1="468.0" y1="174.0" x2="492.0" y2="174.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="496.0" y="108.0" width="200.0" height="132.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="510.0" y="136.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">Test every cell</text><text x="510.0" y="160.7" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">circle vs cell rectangle</text><text x="510.0" y="180.9" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">+ rough spot cone test</text><text x="510.0" y="201.2" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">hit → mask |= 1 &lt;&lt; i</text><line x1="698.0" y1="174.0" x2="722.0" y2="174.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="726.0" y="108.0" width="200.0" height="132.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="740.0" y="136.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">Upload</text><text x="740.0" y="160.7" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">_MaskBuffer (W × H)</text><text x="740.0" y="180.9" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">grid size, light count,</text><text x="740.0" y="201.2" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">occupancy bias</text><rect x="20.0" y="290.0" width="920.0" height="236.0" rx="10" fill="#0d1210" stroke="#2a2a2a"/><text x="36.0" y="318.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="bold">GPU · Custom/OccupancyLit · every pixel, every frame</text><line x1="826.0" y1="242.0" x2="826.0" y2="330.0" stroke="#38de2c" stroke-width="2" marker-end="url(#ahg)"/><rect x="726.0" y="334.0" width="200.0" height="120.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="740.0" y="362.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">Find my cell</text><text x="740.0" y="386.6" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">screen UV × grid size</text><text x="740.0" y="406.9" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">→ (cx, cy)</text><line x1="724.0" y1="394.0" x2="700.0" y2="394.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="496.0" y="334.0" width="200.0" height="120.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="510.0" y="362.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">Read the mask</text><text x="510.0" y="386.6" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">_MaskBuffer[cy·W + cx]</text><text x="510.0" y="406.9" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">one read per pixel</text><line x1="494.0" y1="394.0" x2="470.0" y2="394.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="266.0" y="334.0" width="200.0" height="120.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="280.0" y="362.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">Walk the set bits</text><text x="280.0" y="386.6" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">attenuation + spot cone</text><text x="280.0" y="406.9" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">NdotL, Blinn-Phong spec</text><line x1="264.0" y1="394.0" x2="240.0" y2="394.0" stroke="#a8a8a8" stroke-width="2" marker-end="url(#ah)"/><rect x="36.0" y="334.0" width="200.0" height="120.0" rx="10" fill="#151a17" stroke="#2f4a33" stroke-width="1.5"/><text x="50.0" y="362.0" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="bold">Final colour</text><text x="50.0" y="386.6" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">albedo × (ambient + dir</text><text x="50.0" y="406.9" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">+ masked lights + rim)</text><text x="50.0" y="427.1" font-size="15" fill="#a8a8a8" text-anchor="start" font-weight="normal">+ specular</text><path d="M 596 456 C 596 500, 136 500, 136 460" fill="none" stroke="#ff7a5a" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 4"/><text x="366.0" y="516.0" font-size="15" fill="#ff7a5a" text-anchor="middle" font-weight="normal">mask = 0 → skip straight to ambient + directional + rim</text></svg>