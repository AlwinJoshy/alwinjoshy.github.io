<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1310" width="600" height="1310" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">From a light's range to a circle on the screen</title><desc id="d">Side view: the light's range is projected through the camera to a pixel radius at the light's depth. Then a closest-point test checks the circle against each cell rectangle.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#a8a8a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#38de2c"/></marker></defs><rect width="600" height="1310" rx="14" fill="#111"/><text x="30.0" y="48.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">From a light's range to</text><text x="30.0" y="82.0" font-size="26" fill="#e6e6e6" text-anchor="start" font-weight="bold">a circle on the screen</text><rect x="20.0" y="90.0" width="560.0" height="500.0" rx="10" fill="#0d1210" stroke="#2a2a2a"/><g transform="translate(26.0,110.0) scale(1.0300)"><path d="M 40 200 L 520 20 M 40 200 L 520 380" fill="none" stroke="#3a3a3a" stroke-width="2"/><line x1="40.0" y1="200.0" x2="520.0" y2="200.0" stroke="#333" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="150.0" y1="50.0" x2="150.0" y2="350.0" stroke="#6a6a6a" stroke-width="3"/><text x="150.0" y="375.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">screen</text><circle cx="400.0" cy="150.0" r="60.0" fill="#4ad8ff" fill-opacity=".12"/><circle cx="400.0" cy="150.0" r="60.0" fill="none" stroke="#4ad8ff" stroke-width="2" stroke-dasharray="6 4"/><circle cx="400.0" cy="150.0" r="6.0" fill="#4ad8ff"/><line x1="400.0" y1="150.0" x2="400.0" y2="90.0" stroke="#4ad8ff" stroke-width="2"/><text x="408.0" y="120.0" font-size="18" fill="#4ad8ff" text-anchor="start" font-weight="normal">range</text><line x1="40.0" y1="200.0" x2="400.0" y2="90.0" stroke="#38de2c" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="40.0" y1="200.0" x2="400.0" y2="210.0" stroke="#38de2c" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="150.0" y1="166.4" x2="150.0" y2="203.1" stroke="#38de2c" stroke-width="6"/><text x="162.0" y="189.7" font-size="18" fill="#38de2c" text-anchor="start" font-weight="normal">pixel radius × 2</text><line x1="40.0" y1="425.0" x2="400.0" y2="425.0" stroke="#a8a8a8" stroke-width="1.5" marker-end="url(#ah)"/><text x="220.0" y="450.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">z = light depth (sp.z)</text><circle cx="40.0" cy="200.0" r="10.0" fill="#e6e6e6"/><text x="40.0" y="182.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">camera</text><path d="M 100 200 A 60 60 0 0 0 96.17975065414268 178.9325935046965" fill="none" stroke="#a8a8a8" stroke-width="1.5"/><text x="90.0" y="236.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">FOV/2</text></g><text x="30.0" y="630.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">1 · Project the range</text><text x="30.0" y="664.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">focal = screenHeight / (2·tan(FOV/2))</text><text x="30.0" y="690.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">pixelRadius = range × focal / z</text><text x="30.0" y="734.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">Hypothetical example: 1080 px tall, FOV 60°,</text><text x="30.0" y="760.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">range 2, z = 10 → focal ≈ 935 px,</text><text x="30.0" y="786.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">radius ≈ 187 px</text><text x="30.0" y="850.0" font-size="21" fill="#e6e6e6" text-anchor="start" font-weight="bold">2 · Test circle vs. cell</text><g transform="translate(60.0,1030.0) scale(1.1000)"><rect x="0.0" y="0.0" width="140.0" height="80.0" rx="0" fill="#1f3a1c" stroke="#38de2c" stroke-width="2"/><text x="70.0" y="46.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">cell</text><circle cx="230.0" cy="-40.0" r="6.0" fill="#ff5c5c"/><circle cx="230.0" cy="-40.0" r="110.0" fill="none" stroke="#ff5c5c" stroke-dasharray="6 4" stroke-width="1.5"/><line x1="230.0" y1="-40.0" x2="140.0" y2="-40.0" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="140.0" y1="-40.0" x2="140.0" y2="0.0" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="230.0" y1="-40.0" x2="140.0" y2="0.0" stroke="#ff7a5a" stroke-width="2"/><circle cx="140.0" cy="0.0" r="5.0" fill="#ff7a5a"/><text x="150.0" y="26.0" font-size="18" fill="#ff7a5a" text-anchor="start" font-weight="normal">closest point</text><text x="185.0" y="-50.0" font-size="18" fill="#a8a8a8" text-anchor="middle" font-weight="normal">dx</text><text x="126.0" y="-14.0" font-size="18" fill="#a8a8a8" text-anchor="end" font-weight="normal">dy</text></g><text x="30.0" y="1150.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">dx = max(|lightX−cellX| − cellW/2, 0)</text><text x="30.0" y="1176.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">dy = max(|lightY−cellY| − cellH/2, 0)</text><text x="30.0" y="1202.0" font-size="16" fill="#38de2c" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace">overlap if dx² + dy² ≤ pixelRadius²</text><text x="30.0" y="1250.0" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">Lights behind the camera (sp.z &lt; 0)</text><text x="30.0" y="1274.3" font-size="18" fill="#a8a8a8" text-anchor="start" font-weight="normal">are skipped entirely.</text></svg>